<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#059669">
  <title>سیستم مدیریت مکتب - نسخه کامل</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * { font-family: 'Vazirmatn', sans-serif; }
    body { background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); min-height: 100vh; }
    .card-hover { transition: all 0.3s ease; }
    .card-hover:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -12px rgba(0,0,0,0.2); }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
    .modal.active { display: flex; }
    .toast { position: fixed; bottom: 20px; right: 20px; background: #333; color: white; padding: 12px 20px; border-radius: 8px; z-index: 2000; display: none; }
    .lang-btn.active { background: #059669; color: white; }
    .rtl { direction: rtl; }
    .ltr { direction: ltr; }
    .ad-card { border: 2px solid #fbbf24; background: linear-gradient(135deg, #fffbeb, #fef3c7); }
    .camera-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 3000; display: none; flex-direction: column; }
    .camera-modal.active { display: flex; }
    video { width: 100%; height: 60%; object-fit: cover; }
    .hidden-role { display: none; }
  </style>
</head>
<body class="rtl">

<div id="toast" class="toast"></div>

<!-- Camera Modal -->
<div id="cameraModal" class="camera-modal">
  <div class="flex justify-between p-4 bg-gray-900 text-white">
    <h3 id="cameraTitle">گرفتن عکس حاضری</h3>
    <button onclick="closeCamera()" class="text-white text-xl">&times;</button>
  </div>
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" style="display: none;"></canvas>
  <div class="p-4 bg-gray-900 flex gap-3">
    <button onclick="capturePhoto()" class="flex-1 bg-green-600 text-white py-3 rounded-lg">📸 گرفتن عکس</button>
    <button onclick="uploadFromGallery()" class="flex-1 bg-blue-600 text-white py-3 rounded-lg">🖼 انتخاب از گالری</button>
  </div>
  <div id="aiResult" class="p-4 bg-white dark:bg-gray-800 hidden"></div>
</div>

<!-- Main App -->
<div id="app" class="container mx-auto px-4 py-6 max-w-7xl">
  
  <!-- Header -->
  <div class="flex justify-between items-center mb-6 flex-wrap gap-3">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 bg-gradient-to-br from-emerald-600 to-teal-600 rounded-2xl flex items-center justify-center shadow-lg">
        <i class="fas fa-school text-white text-2xl"></i>
      </div>
      <div>
        <h1 id="appTitle" class="text-2xl font-bold text-emerald-800">سیستم مدیریت مکتب</h1>
        <p class="text-xs text-gray-500">نسخه کامل - آفلاین</p>
      </div>
    </div>
    <div class="flex gap-2">
      <div class="flex bg-white rounded-lg shadow">
        <button onclick="setLang('dari')" id="langDari" class="px-3 py-2 text-sm lang-btn active">دری</button>
        <button onclick="setLang('pashto')" id="langPashto" class="px-3 py-2 text-sm lang-btn">پښتو</button>
        <button onclick="setLang('english')" id="langEnglish" class="px-3 py-2 text-sm lang-btn">English</button>
      </div>
      <div id="userInfo" class="bg-white rounded-lg shadow px-4 py-2 flex items-center gap-2 hidden" style="display:none">
        <i class="fas fa-user-circle text-emerald-600 text-xl"></i>
        <span id="userName" class="font-medium"></span>
        <span id="userRole" class="text-xs text-gray-500"></span>
      </div>
      <button id="logoutBtn" onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 hidden" style="display:none">خروج</button>
    </div>
  </div>
  
  <!-- Role Selection Cards - shown only before login -->
  <div id="roleSelection" class="grid md:grid-cols-4 gap-6 mb-8">
    <div onclick="showLoginModal('principal')" class="bg-white rounded-2xl p-6 shadow-lg card-hover cursor-pointer text-center">
      <div class="w-16 h-16 bg-amber-500 rounded-2xl flex items-center justify-center mx-auto mb-4"><i class="fas fa-crown text-white text-3xl"></i></div>
      <h3 class="text-xl font-bold">مدیر مکتب</h3>
      <p class="text-sm text-gray-500">مدیریت کامل، تبلیغات، گزارشات</p>
    </div>
    <div onclick="showLoginModal('finance')" class="bg-white rounded-2xl p-6 shadow-lg card-hover cursor-pointer text-center">
      <div class="w-16 h-16 bg-emerald-500 rounded-2xl flex items-center justify-center mx-auto mb-4"><i class="fas fa-chart-line text-white text-3xl"></i></div>
      <h3 class="text-xl font-bold">مدیر مالی</h3>
      <p class="text-sm text-gray-500">دریافت شهریه، حسابداری</p>
    </div>
    <div onclick="showLoginModal('headteacher')" class="bg-white rounded-2xl p-6 shadow-lg card-hover cursor-pointer text-center">
      <div class="w-16 h-16 bg-blue-500 rounded-2xl flex items-center justify-center mx-auto mb-4"><i class="fas fa-chalkboard-user text-white text-3xl"></i></div>
      <h3 class="text-xl font-bold">استاد سر</h3>
      <p class="text-sm text-gray-500">مدیریت شاگردان، فرم‌ها</p>
    </div>
    <div onclick="showLoginModal('teacher')" class="bg-white rounded-2xl p-6 shadow-lg card-hover cursor-pointer text-center">
      <div class="w-16 h-16 bg-purple-500 rounded-2xl flex items-center justify-center mx-auto mb-4"><i class="fas fa-person-chalkboard text-white text-3xl"></i></div>
      <h3 class="text-xl font-bold">استاد</h3>
      <p class="text-sm text-gray-500">حاضری، امتحانات</p>
    </div>
  </div>
  
  <div id="dashboardContainer"></div>
</div>

<!-- Login Modal -->
<div id="loginModal" class="modal">
  <div class="bg-white rounded-2xl p-8 max-w-md w-full mx-4 shadow-2xl">
    <div class="text-center mb-6">
      <div class="w-20 h-20 bg-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-4"><i class="fas fa-graduation-cap text-white text-4xl"></i></div>
      <h2 class="text-2xl font-bold">ورود به سیستم</h2>
      <p id="loginRoleText" class="text-sm text-gray-500 mt-1"></p>
    </div>
    <form onsubmit="handleLogin(event)">
      <input type="email" id="loginEmail" placeholder="ایمیل" required class="w-full border rounded-lg p-3 mb-3 ltr">
      <input type="password" id="loginPassword" placeholder="رمز عبور" required class="w-full border rounded-lg p-3 mb-4 ltr">
      <input type="hidden" id="selectedRoleForLogin" value="">
      <button type="submit" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-semibold">ورود</button>
    </form>
    <div class="text-center mt-4"><button onclick="showSignupModal()" class="text-emerald-600">حساب ندارید؟ ثبت نام</button></div>
  </div>
</div>

<!-- Signup Modal -->
<div id="signupModal" class="modal">
  <div class="bg-white rounded-2xl p-8 max-w-2xl w-full mx-4 shadow-2xl max-h-[90vh] overflow-y-auto">
    <h2 class="text-2xl font-bold text-center mb-6">ثبت نام</h2>
    <form onsubmit="handleSignup(event)" class="space-y-4">
      <div class="grid md:grid-cols-2 gap-4">
        <input type="text" id="signupFirstName" placeholder="نام" required class="border rounded-lg p-3">
        <input type="text" id="signupLastName" placeholder="نام خانوادگی" required class="border rounded-lg p-3">
      </div>
      <input type="email" id="signupEmail" placeholder="ایمیل" required class="w-full border rounded-lg p-3 ltr">
      <input type="tel" id="signupPhone" placeholder="شماره تماس" required class="w-full border rounded-lg p-3 ltr">
      <input type="text" id="signupSchool" placeholder="نام مکتب" required class="w-full border rounded-lg p-3">
      <input type="password" id="signupPassword" placeholder="رمز عبور" required class="w-full border rounded-lg p-3 ltr">
      
      <select id="signupRole" class="w-full border rounded-lg p-3" onchange="toggleTeacherSignupFields()">
        <option value="principal">مدیر مکتب</option>
        <option value="finance">مدیر مالی</option>
        <option value="headteacher">استاد سر</option>
        <option value="teacher">استاد</option>
      </select>
      
      <!-- Teacher specific fields -->
      <div id="teacherSignupFields" class="hidden space-y-4 border-t pt-4">
        <h3 class="font-bold text-emerald-700">اطلاعات تدریسی</h3>
        <input type="text" id="teacherSubjects" placeholder="مضمون‌های تدریسی (مثل: ریاضی, دری, علوم)" class="w-full border rounded-lg p-3">
        <input type="text" id="teacherClasses" placeholder="صنف‌های تدریسی (مثل: صنف ۶, صنف ۷, صنف ۸)" class="w-full border rounded-lg p-3">
      </div>
      
      <button type="submit" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-semibold">ثبت نام</button>
    </form>
    <div class="text-center mt-4"><button onclick="closeSignupModal()" class="text-emerald-600">قبلاً حساب دارید؟ وارد شوید</button></div>
  </div>
</div>

<script>
// ==================== STORAGE KEYS ====================
const STORAGE = {
  USERS: 'school_users_secure_final',
  STUDENTS: 'school_students_complete_final',
  TEACHERS: 'school_teachers_complete_final',
  CLASSES: 'school_classes_complete_final',
  SUBJECTS: 'school_subjects_complete_final',
  HOMEWORK: 'school_homework_complete_final',
  ATTENDANCE: 'school_attendance_complete_final',
  SALARIES: 'school_salaries_complete_final',
  FEES: 'school_fees_complete_final',
  JOURNAL: 'school_journal_complete_final',
  AD_PACKAGES: 'school_ad_packages_complete_final',
  AD_PURCHASES: 'school_ad_purchases_complete_final',
  TEMP_STUDENTS: 'school_temp_students_complete_final',
  CONDITIONAL: 'school_conditional_complete_final',
  BANNED: 'school_banned_complete_final',
  TRANSFERS: 'school_transfers_complete_final'
};

let currentUser = null;
let currentRole = null;
let currentLang = localStorage.getItem('lang') || 'dari';

const translations = {
  dari: { principal: "مدیر مکتب", finance: "مدیر مالی", headteacher: "استاد سر", teacher: "استاد", attendance: "حاضری", salary: "معاش", profit: "سود", loss: "زیان", journal: "ژورنال", advertising: "تبلیغات", selectClass: "انتخاب صنف", present: "حاضر", absent: "غایب", save: "ذخیره", delete: "حذف", newEnrollment: "فورم جدید الشمول", temporary: "شاگردان موقت" },
  pashto: { principal: "د مکتب مدیر", finance: "مالي مدیر", headteacher: "لومړی استاد", teacher: "استاد", attendance: "حاضرتی", salary: "معاش", profit: "ګټه", loss: "زیان", journal: "ژورنال", advertising: "اعلانات", selectClass: "صنف انتخاب کړئ", present: "حاضر", absent: "غایب", save: "خوندي کول", delete: "ړنګول", newEnrollment: "د نوي شاملیدو فورم", temporary: "عارضي زده کونکي" },
  english: { principal: "Principal", finance: "Finance Manager", headteacher: "Head Teacher", teacher: "Teacher", attendance: "Attendance", salary: "Salary", profit: "Profit", loss: "Loss", journal: "Journal", advertising: "Advertising", selectClass: "Select Class", present: "Present", absent: "Absent", save: "Save", delete: "Delete", newEnrollment: "New Enrollment Form", temporary: "Temporary Students" }
};

function t(key) { return translations[currentLang][key] || key; }

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('lang', lang);
  document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById(`lang${lang.charAt(0).toUpperCase() + lang.slice(1)}`).classList.add('active');
  document.getElementById('appTitle').textContent = "سیستم مدیریت مکتب";
}

function showToast(msg, isError = false) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.style.background = isError ? '#dc2626' : '#059669';
  toast.style.display = 'block';
  setTimeout(() => toast.style.display = 'none', 3000);
}

function toggleTeacherSignupFields() {
  const role = document.getElementById('signupRole').value;
  const teacherFields = document.getElementById('teacherSignupFields');
  teacherFields.classList.toggle('hidden', role !== 'teacher');
}

// ==================== INIT DATA ====================
function initData() {
  if (!localStorage.getItem(STORAGE.USERS)) {
    localStorage.setItem(STORAGE.USERS, JSON.stringify([
      { id: '1', email: 'principal@school.com', password: 'principal123', firstName: 'مدیر', lastName: 'سیستم', phone: '0770000000', school: 'مکتب نمونه', role: 'principal' },
      { id: '2', email: 'teacher@school.com', password: 'teacher123', firstName: 'احمد', lastName: 'شاه', phone: '0770000001', school: 'مکتب نمونه', role: 'teacher', subjects: 'ریاضی, دری', classes: 'صنف ۶, صنف ۷' }
    ]));
  }
  if (!localStorage.getItem(STORAGE.CLASSES)) {
    localStorage.setItem(STORAGE.CLASSES, JSON.stringify([
      { id: '1', name: 'صنف ۶', gradeLevel: 6 }, { id: '2', name: 'صنف ۷', gradeLevel: 7 }, { id: '3', name: 'صنف ۸', gradeLevel: 8 }
    ]));
  }
  if (!localStorage.getItem(STORAGE.SUBJECTS)) {
    localStorage.setItem(STORAGE.SUBJECTS, JSON.stringify([
      { id: '1', name: 'دری', fullMarks: 100 }, { id: '2', name: 'پښتو', fullMarks: 100 }, { id: '3', name: 'ریاضی', fullMarks: 100 }
    ]));
  }
  if (!localStorage.getItem(STORAGE.TEACHERS)) localStorage.setItem(STORAGE.TEACHERS, JSON.stringify([]));
  if (!localStorage.getItem(STORAGE.STUDENTS)) localStorage.setItem(STORAGE.STUDENTS, JSON.stringify([]));
  if (!localStorage.getItem(STORAGE.HOMEWORK)) localStorage.setItem(STORAGE.HOMEWORK, JSON.stringify([]));
  if (!localStorage.getItem(STORAGE.ATTENDANCE)) localStorage.setItem(STORAGE.ATTENDANCE, JSON.stringify([]));
  if (!localStorage.getItem(STORAGE.SALARIES)) localStorage.setItem(STORAGE.SALARIES, JSON.stringify([]));
  if (!localStorage.getItem(STORAGE.FEES)) localStorage.setItem(STORAGE.FEES, JSON.stringify([]));
  if (!localStorage.getItem(STORAGE.JOURNAL)) localStorage.setItem(STORAGE.JOURNAL, JSON.stringify([]));
  if (!localStorage.getItem(STORAGE.AD_PACKAGES)) {
    localStorage.setItem(STORAGE.AD_PACKAGES, JSON.stringify([
      { id: '1', name: 'پکیج یک ماهه', months: 1, priceUSD: 10, priceAFN: 850 }
    ]));
  }
  if (!localStorage.getItem(STORAGE.AD_PURCHASES)) localStorage.setItem(STORAGE.AD_PURCHASES, JSON.stringify([]));
  if (!localStorage.getItem(STORAGE.TEMP_STUDENTS)) localStorage.setItem(STORAGE.TEMP_STUDENTS, JSON.stringify([]));
}

// ==================== AUTH UI ====================
let pendingRole = null;

function showLoginModal(role) {
  pendingRole = role;
  const roleText = role === 'principal' ? 'مدیر مکتب' : role === 'finance' ? 'مدیر مالی' : role === 'headteacher' ? 'استاد سر' : 'استاد';
  document.getElementById('loginRoleText').innerHTML = `ورود به حساب ${roleText}`;
  document.getElementById('selectedRoleForLogin').value = role;
  document.getElementById('loginModal').classList.add('active');
}

function closeLoginModal() {
  document.getElementById('loginModal').classList.remove('active');
  pendingRole = null;
}

function showSignupModal() {
  closeLoginModal();
  document.getElementById('signupModal').classList.add('active');
  toggleTeacherSignupFields();
}

function closeSignupModal() {
  document.getElementById('signupModal').classList.remove('active');
  showLoginModal(pendingRole || 'principal');
}

function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const selectedRole = document.getElementById('selectedRoleForLogin').value;
  const users = JSON.parse(localStorage.getItem(STORAGE.USERS));
  const user = users.find(u => u.email === email && u.password === password);
  
  if (!user) {
    showToast('ایمیل یا رمز عبور اشتباه است', true);
    return;
  }
  
  if (user.role !== selectedRole) {
    showToast(`شما دسترسی به بخش ${selectedRole === 'principal' ? 'مدیر مکتب' : selectedRole === 'finance' ? 'مدیر مالی' : selectedRole === 'headteacher' ? 'استاد سر' : 'استاد'} ندارید`, true);
    return;
  }
  
  currentUser = user;
  currentRole = user.role;
  localStorage.setItem('currentUser', JSON.stringify({ id: user.id, role: user.role }));
  
  closeLoginModal();
  document.getElementById('roleSelection').style.display = 'none';
  document.getElementById('userInfo').style.display = 'flex';
  document.getElementById('logoutBtn').style.display = 'block';
  document.getElementById('userName').textContent = `${user.firstName} ${user.lastName}`;
  document.getElementById('userRole').textContent = t(user.role);
  
  renderDashboard();
  showToast(`خوش آمدید ${user.firstName}`);
}

function handleSignup(e) {
  e.preventDefault();
  const firstName = document.getElementById('signupFirstName').value;
  const lastName = document.getElementById('signupLastName').value;
  const email = document.getElementById('signupEmail').value;
  const phone = document.getElementById('signupPhone').value;
  const school = document.getElementById('signupSchool').value;
  const password = document.getElementById('signupPassword').value;
  const role = document.getElementById('signupRole').value;
  const users = JSON.parse(localStorage.getItem(STORAGE.USERS));
  
  if (users.find(u => u.email === email)) {
    showToast('این ایمیل قبلاً ثبت شده است', true);
    return;
  }
  
  const newUser = { id: Date.now().toString(), firstName, lastName, email, phone, school, password, role };
  
  if (role === 'teacher') {
    newUser.subjects = document.getElementById('teacherSubjects').value;
    newUser.classes = document.getElementById('teacherClasses').value;
    const teachers = JSON.parse(localStorage.getItem(STORAGE.TEACHERS));
    teachers.push({ id: newUser.id, fullName: `${firstName} ${lastName}`, phone, subjects: newUser.subjects, classes: newUser.classes, salary: 5000 });
    localStorage.setItem(STORAGE.TEACHERS, JSON.stringify(teachers));
  }
  
  users.push(newUser);
  localStorage.setItem(STORAGE.USERS, JSON.stringify(users));
  showToast('حساب ایجاد شد! لطفاً وارد شوید');
  closeSignupModal();
  showLoginModal(role);
}

function logout() {
  currentUser = null;
  currentRole = null;
  localStorage.removeItem('currentUser');
  document.getElementById('roleSelection').style.display = 'grid';
  document.getElementById('userInfo').style.display = 'none';
  document.getElementById('logoutBtn').style.display = 'none';
  document.getElementById('dashboardContainer').innerHTML = '';
  showToast('از سیستم خارج شدید');
}

function renderDashboard() {
  const container = document.getElementById('dashboardContainer');
  if (currentRole === 'principal') renderPrincipalDashboard(container);
  else if (currentRole === 'finance') renderFinanceDashboard(container);
  else if (currentRole === 'headteacher') renderHeadTeacherDashboard(container);
  else if (currentRole === 'teacher') renderTeacherDashboard(container);
}

// ==================== PRINCIPAL DASHBOARD ====================
function renderPrincipalDashboard(container) {
  container.innerHTML = `
    <div class="bg-white rounded-2xl p-6 shadow-lg mb-6"><div class="flex justify-between"><h2 class="text-2xl font-bold"><i class="fas fa-crown text-amber-500 ml-2"></i> ${t('principal')}</h2></div></div>
    <div class="grid md:grid-cols-3 gap-4 mb-6">
      <div onclick="showClassesTeachers()" class="bg-white p-5 rounded-xl shadow card-hover cursor-pointer text-center"><i class="fas fa-chalkboard text-3xl text-blue-600 mb-2"></i><h3 class="font-bold">صنف‌ها و معلمین</h3></div>
      <div onclick="showSalarySection()" class="bg-white p-5 rounded-xl shadow card-hover cursor-pointer text-center"><i class="fas fa-money-bill text-3xl text-green-600 mb-2"></i><h3 class="font-bold">${t('salary')}</h3></div>
      <div onclick="showAdvertisingSystem()" class="bg-white ad-card p-5 rounded-xl shadow card-hover cursor-pointer text-center"><i class="fas fa-ad text-3xl text-amber-600 mb-2"></i><h3 class="font-bold">${t('advertising')}</h3></div>
    </div>
    <div id="principalContent" class="bg-white rounded-2xl p-6 shadow-lg"></div>
  `;
  showProfitLossReport();
}

function showClassesTeachers() {
  const classes = JSON.parse(localStorage.getItem(STORAGE.CLASSES));
  const teachers = JSON.parse(localStorage.getItem(STORAGE.TEACHERS));
  document.getElementById('principalContent').innerHTML = `<h3 class="text-xl font-bold mb-4">صنف‌ها و معلمین</h3><table class="w-full"><thead><tr class="bg-gray-100"><th class="p-3">صنف</th><th class="p-3">معلم</th><th class="p-3">مضمون‌ها</th></tr></thead><tbody>${classes.map(c => { const tchs = teachers.filter(t => t.classes && t.classes.includes(c.name)); return `<tr><td class="p-3">${c.name}</td><td class="p-3">${tchs.map(t => t.fullName).join(', ') || '-'}</td><td class="p-3">${tchs.map(t => t.subjects).join(', ') || '-'}</td></td>`; }).join('')}</tbody></table>`;
}

function showSalarySection() {
  const teachers = JSON.parse(localStorage.getItem(STORAGE.TEACHERS));
  document.getElementById('principalContent').innerHTML = `<h3 class="text-xl font-bold mb-4">${t('salary')}</h3><table class="w-full"><thead><tr class="bg-gray-100"><th class="p-3">نام</th><th class="p-3">معاش</th><th class="p-3">ماه</th><th class="p-3"></th></tr></thead><tbody>${teachers.map(t => `<tr><td class="p-3">${t.fullName}</td><td class="p-3"><input type="number" id="sal_${t.id}" value="${t.salary||5000}" class="border rounded p-1 w-24"></td><td class="p-3"><select id="month_${t.id}">${['جنوری','فبروری','مارچ','اپریل','می','جون','جولای','آگست','سپتامبر','اکتوبر','نومبر','دسمبر'].map((m,i)=>`<option value="${i+1}">${m}</option>`).join('')}</select></td><td class="p-3"><button onclick="payTeacherSalary('${t.id}')" class="bg-green-600 text-white px-3 py-1 rounded">پرداخت</button></td></tr>`).join('')}</tbody><tr>`;
}

function payTeacherSalary(teacherId) {
  const amount = parseInt(document.getElementById(`sal_${teacherId}`).value);
  const month = document.getElementById(`month_${teacherId}`).value;
  if (!amount) return showToast('مبلغ را وارد کنید', true);
  const salaries = JSON.parse(localStorage.getItem(STORAGE.SALARIES));
  salaries.push({ id: Date.now().toString(), teacherId, amount, month: parseInt(month), date: new Date().toISOString() });
  localStorage.setItem(STORAGE.SALARIES, JSON.stringify(salaries));
  const journal = JSON.parse(localStorage.getItem(STORAGE.JOURNAL));
  journal.push({ id: Date.now().toString(), date: new Date().toISOString(), description: `پرداخت معاش ماه ${month}`, debit: amount, credit: 0 });
  localStorage.setItem(STORAGE.JOURNAL, JSON.stringify(journal));
  showToast(`معاش ${amount} افغانی پرداخت شد`);
  showSalarySection();
}

function showAdvertisingSystem() {
  const packages = JSON.parse(localStorage.getItem(STORAGE.AD_PACKAGES));
  const purchases = JSON.parse(localStorage.getItem(STORAGE.AD_PURCHASES));
  document.getElementById('principalContent').innerHTML = `<h3 class="text-xl font-bold mb-4">${t('advertising')}</h3><div class="grid md:grid-cols-3 gap-4 mb-6">${packages.map(p => `<div class="border-2 border-amber-300 rounded-xl p-4 text-center"><h4 class="font-bold">${p.name}</h4><div class="text-2xl font-bold text-amber-600">${p.priceUSD}$</div><button onclick="buyAd('${p.id}', ${p.priceUSD}, '${p.name}', ${p.months})" class="mt-3 bg-amber-600 text-white px-4 py-2 rounded">خرید</button></div>`).join('')}</div><h4 class="font-bold">تاریخچه</h4><table class="w-full"><thead><tr class="bg-gray-100"><th class="p-2">تاریخ</th><th class="p-2">پکیج</th><th class="p-2">مبلغ</th></tr></thead><tbody>${purchases.map(p => `<tr><td class="p-2">${new Date(p.date).toLocaleDateString('fa-IR')}</td><td class="p-2">${p.packageName}</td><td class="p-2">${p.amountUSD}$</td></tr>`).join('')}</tbody></table>`;
}

function buyAd(packageId, priceUSD, packageName, months) {
  const purchases = JSON.parse(localStorage.getItem(STORAGE.AD_PURCHASES));
  purchases.push({ id: Date.now().toString(), packageId, packageName, amountUSD: priceUSD, amountAFN: priceUSD*85, date: new Date().toISOString() });
  localStorage.setItem(STORAGE.AD_PURCHASES, JSON.stringify(purchases));
  const journal = JSON.parse(localStorage.getItem(STORAGE.JOURNAL));
  journal.push({ id: Date.now().toString(), date: new Date().toISOString(), description: `خرید ${packageName} تبلیغات`, debit: 0, credit: priceUSD*85 });
  localStorage.setItem(STORAGE.JOURNAL, JSON.stringify(journal));
  showToast(`پکیج ${packageName} خریداری شد`);
  showAdvertisingSystem();
}

function showProfitLossReport() {
  const journal = JSON.parse(localStorage.getItem(STORAGE.JOURNAL));
  const totalCredit = journal.reduce((s,j)=>s+(j.credit||0),0);
  const totalDebit = journal.reduce((s,j)=>s+(j.debit||0),0);
  document.getElementById('principalContent').innerHTML = `<h3 class="text-xl font-bold mb-4">گزارش سود و زیان</h3><div class="grid md:grid-cols-3 gap-4 mb-6"><div class="bg-green-50 p-4 rounded-xl"><div class="text-2xl font-bold text-green-600">${totalCredit}</div><div>دریافتی</div></div><div class="bg-red-50 p-4 rounded-xl"><div class="text-2xl font-bold text-red-600">${totalDebit}</div><div>پرداختی</div></div><div class="bg-blue-50 p-4 rounded-xl"><div class="text-2xl font-bold text-blue-600">${totalCredit-totalDebit}</div><div>${totalCredit>=totalDebit?'سود':'زیان'}</div></div></div><h4 class="font-bold">ژورنال</h4><table class="w-full"><thead><tr class="bg-gray-100"><th class="p-2">تاریخ</th><th class="p-2">شرح</th><th class="p-2">بدهکار</th><th class="p-2">بستانکار</th></tr></thead><tbody>${journal.map(j=>`<tr><td class="p-2">${new Date(j.date).toLocaleDateString('fa-IR')}</td><td class="p-2">${j.description}</td><td class="p-2">${j.debit||0}</td><td class="p-2">${j.credit||0}</td></tr>`).join('')}</tbody></table><button onclick="exportToExcel()" class="mt-4 bg-emerald-600 text-white px-4 py-2 rounded">خروجی Excel</button>`;
}

// ==================== FINANCE DASHBOARD ====================
function renderFinanceDashboard(container) {
  container.innerHTML = `<div class="bg-white rounded-2xl p-6 shadow-lg mb-6"><h2 class="text-2xl font-bold"><i class="fas fa-chart-line text-emerald-500 ml-2"></i> ${t('finance')}</h2></div><div id="financeContent" class="bg-white rounded-2xl p-6 shadow-lg"></div>`;
  showFullFeeCollection();
}

function showFullFeeCollection() {
  const students = JSON.parse(localStorage.getItem(STORAGE.STUDENTS));
  const fees = JSON.parse(localStorage.getItem(STORAGE.FEES));
  document.getElementById('financeContent').innerHTML = `<h3 class="text-xl font-bold mb-4">دریافت شهریه - جزئیات شاگردان</h3><table class="w-full text-sm"><thead><tr class="bg-gray-100"><th class="p-2">نام شاگرد</th><th class="p-2">نام پدر</th><th class="p-2">ولایت</th><th class="p-2">نزدیکان/نسبت</th><th class="p-2">شماره</th><th class="p-2">شهریه</th><th class="p-2">پرداخت شده</th><th class="p-2"></th></tr></thead><tbody>${students.map(s => { const paid = fees.filter(f=>f.studentId===s.id).reduce((sum,f)=>sum+f.amount,0); const remaining = (s.monthlyFee||1000)-paid; return `<tr><td class="p-2">${s.fullName}</td><td class="p-2">${s.fatherName||'-'}</td><td class="p-2">${s.currentProvince||'-'}</td><td class="p-2">${s.relativeName||'-'} (${s.relationship||'-'})</td><td class="p-2">${s.parentPhone||'-'}</td><td class="p-2">${s.monthlyFee||1000}</td><td class="p-2 text-green-600">${paid}</td><td class="p-2"><input type="number" id="fee_${s.id}" class="w-20 border rounded p-1" placeholder="مبلغ"><button onclick="collectStudentFee('${s.id}', '${s.fullName}')" class="bg-emerald-600 text-white px-2 py-1 rounded">دریافت</button></td></tr>`}).join('')}</tbody><tr>`;
}

function collectStudentFee(studentId, studentName) {
  const amount = parseInt(document.getElementById(`fee_${studentId}`).value);
  if(!amount) return showToast('مبلغ را وارد کنید', true);
  const fees = JSON.parse(localStorage.getItem(STORAGE.FEES));
  fees.push({ id: Date.now().toString(), studentId, amount, date: new Date().toISOString() });
  localStorage.setItem(STORAGE.FEES, JSON.stringify(fees));
  const journal = JSON.parse(localStorage.getItem(STORAGE.JOURNAL));
  journal.push({ id: Date.now().toString(), date: new Date().toISOString(), description: `دریافت شهریه از ${studentName}`, debit: 0, credit: amount });
  localStorage.setItem(STORAGE.JOURNAL, JSON.stringify(journal));
  showToast(`مبلغ ${amount} افغانی دریافت شد`);
  showFullFeeCollection();
}

// ==================== HEAD TEACHER DASHBOARD ====================
function renderHeadTeacherDashboard(container) {
  container.innerHTML = `<div class="bg-white rounded-2xl p-6 shadow-lg mb-6"><h2 class="text-2xl font-bold"><i class="fas fa-graduation-cap text-blue-500 ml-2"></i> ${t('headteacher')}</h2></div><div class="grid md:grid-cols-2 gap-4 mb-6"><div onclick="showStudentForm()" class="bg-white p-5 rounded-xl shadow card-hover cursor-pointer text-center"><i class="fas fa-user-plus text-3xl text-emerald-600 mb-2"></i><h3 class="font-bold">${t('newEnrollment')}</h3></div><div onclick="showStudentList()" class="bg-white p-5 rounded-xl shadow card-hover cursor-pointer text-center"><i class="fas fa-users text-3xl text-blue-600 mb-2"></i><h3 class="font-bold">لیست شاگردان</h3></div></div><div id="headContent" class="bg-white rounded-2xl p-6 shadow-lg"></div>`;
}

function showStudentForm() {
  const classes = JSON.parse(localStorage.getItem(STORAGE.CLASSES));
  document.getElementById('headContent').innerHTML = `<h3 class="text-xl font-bold mb-4">${t('newEnrollment')}</h3><form onsubmit="saveStudent(event)" class="grid md:grid-cols-2 gap-4"><input type="text" id="fullName" placeholder="نام کامل" required class="border rounded p-2"><input type="text" id="fatherName" placeholder="نام پدر" class="border rounded p-2"><input type="text" id="tazkira" placeholder="شماره تذکره" class="border rounded p-2"><input type="number" id="age" placeholder="سن" class="border rounded p-2"><input type="text" id="fatherJob" placeholder="شغل پدر" class="border rounded p-2"><input type="text" id="currentProvince" placeholder="ولایت فعلی" class="border rounded p-2"><input type="text" id="currentDistrict" placeholder="ولسوالی" class="border rounded p-2"><input type="text" id="relativeName" placeholder="نام نزدیکان" class="border rounded p-2"><select id="relationship" class="border rounded p-2"><option value="کاکا">کاکا</option><option value="ماما">ماما</option><option value="پسر ماما">پسر ماما</option></select><input type="tel" id="parentPhone" placeholder="شماره والدین" class="border rounded p-2"><select id="classId" class="border rounded p-2">${classes.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select><input type="number" id="monthlyFee" placeholder="شهریه ماهانه" value="1000" class="border rounded p-2"><div class="md:col-span-2"><button type="submit" class="bg-emerald-600 text-white px-6 py-2 rounded-lg w-full">ثبت</button></div></form>`;
}

function saveStudent(e) {
  e.preventDefault();
  const students = JSON.parse(localStorage.getItem(STORAGE.STUDENTS));
  students.push({ id: Date.now().toString(), fullName: document.getElementById('fullName').value, fatherName: document.getElementById('fatherName').value, tazkira: document.getElementById('tazkira').value, age: document.getElementById('age').value, fatherJob: document.getElementById('fatherJob').value, currentProvince: document.getElementById('currentProvince').value, currentDistrict: document.getElementById('currentDistrict').value, relativeName: document.getElementById('relativeName').value, relationship: document.getElementById('relationship').value, parentPhone: document.getElementById('parentPhone').value, classId: document.getElementById('classId').value, monthlyFee: parseInt(document.getElementById('monthlyFee').value), rollNumber: students.length+1 });
  localStorage.setItem(STORAGE.STUDENTS, JSON.stringify(students));
  showToast('شاگرد ثبت شد');
  showStudentList();
}

function showStudentList() {
  const students = JSON.parse(localStorage.getItem(STORAGE.STUDENTS));
  document.getElementById('headContent').innerHTML = `<h3 class="text-xl font-bold mb-4">لیست شاگردان</h3><table class="w-full"><thead><tr class="bg-gray-100"><th class="p-2">نام</th><th class="p-2">نام پدر</th><th class="p-2">ولایت</th><th class="p-2">شهریه</th></tr></thead><tbody>${students.map(s=>`<tr><td class="p-2">${s.fullName}</td><td class="p-2">${s.fatherName||'-'}</td><td class="p-2">${s.currentProvince||'-'}</td><td class="p-2">${s.monthlyFee}</td></tr>`).join('')}</tbody></table>`;
}

// ==================== TEACHER DASHBOARD ====================
function renderTeacherDashboard(container) {
  const teacherInfo = JSON.parse(localStorage.getItem(STORAGE.TEACHERS)).find(t=>t.id===currentUser?.id);
  container.innerHTML = `<div class="bg-white rounded-2xl p-6 shadow-lg mb-6"><h2 class="text-2xl font-bold"><i class="fas fa-person-chalkboard text-purple-500 ml-2"></i> ${t('teacher')}</h2>${teacherInfo?`<p class="text-sm text-gray-500 mt-2">مضمون‌ها: ${teacherInfo.subjects||'-'} | صنف‌ها: ${teacherInfo.classes||'-'}</p>`:''}</div><div id="teacherSection" class="bg-white rounded-2xl p-6 shadow-lg"></div>`;
  showTeacherAttendance();
}

function showTeacherAttendance() {
  const classes = JSON.parse(localStorage.getItem(STORAGE.CLASSES));
  document.getElementById('teacherSection').innerHTML = `<h3 class="text-xl font-bold mb-4">${t('attendance')}</h3><select id="attClass" class="w-full max-w-xs border rounded-lg p-2 mb-4" onchange="loadAttendanceStudents()"><option value="">${t('selectClass')}</option>${classes.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select><div id="attendanceList"></div><button onclick="openCameraForAttendance()" class="mt-4 bg-emerald-600 text-white px-4 py-2 rounded-lg"><i class="fas fa-camera ml-1"></i> ثبت حاضری با AI</button>`;
}

function loadAttendanceStudents() {
  const classId = document.getElementById('attClass').value;
  if(!classId) return;
  const students = JSON.parse(localStorage.getItem(STORAGE.STUDENTS)).filter(s=>s.classId===classId);
  document.getElementById('attendanceList').innerHTML = `<div class="grid gap-3 mt-4">${students.map(s=>`<div class="flex justify-between items-center border rounded p-3"><span>${s.fullName}</span><div><button onclick="markPresent('${s.id}')" class="bg-green-500 text-white px-3 py-1 rounded ml-1">${t('present')}</button><button onclick="markAbsent('${s.id}')" class="bg-red-500 text-white px-3 py-1 rounded">${t('absent')}</button></div></div>`).join('')}</div><button onclick="saveAttendance()" class="mt-4 bg-emerald-600 text-white px-4 py-2 rounded-lg w-full">${t('save')}</button>`;
  window.tempAttendance = {};
}

let tempAttendance = {};
function markPresent(id) { tempAttendance[id] = 'present'; showToast('حاضر ثبت شد'); }
function markAbsent(id) { tempAttendance[id] = 'absent'; showToast('غایب ثبت شد'); }

function saveAttendance() {
  const attendance = JSON.parse(localStorage.getItem(STORAGE.ATTENDANCE));
  const classId = document.getElementById('attClass').value;
  const today = new Date().toISOString().split('T')[0];
  for(const [sid,status] of Object.entries(tempAttendance)){
    attendance.push({ id: Date.now().toString()+sid, studentId: sid, classId, date: today, status });
    if(status==='absent'){
      const students = JSON.parse(localStorage.getItem(STORAGE.STUDENTS));
      const student = students.find(s=>s.id===sid);
      if(student?.parentPhone) showToast(`اطلاعیه غیابی به ${student.parentPhone} ارسال شد`);
    }
  }
  localStorage.setItem(STORAGE.ATTENDANCE, JSON.stringify(attendance));
  showToast('حاضری ثبت شد');
  loadAttendanceStudents();
}

function uploadExamExcel() {
  const input = document.createElement('input');
  input.type='file';
  input.accept='.xlsx,.xls';
  input.onchange=(e)=>{
    const file=e.target.files[0];
    const reader=new FileReader();
    reader.onload=(evt)=>{
      const data=new Uint8Array(evt.target.result);
      const workbook=XLSX.read(data,{type:'array'});
      const sheet=workbook.Sheets[workbook.SheetNames[0]];
      const json=XLSX.utils.sheet_to_json(sheet);
      localStorage.setItem('uploaded_exam_data',JSON.stringify(json));
      showToast(`Excel آپلود شد! ${json.length} رکورد`);
    };
    reader.readAsArrayBuffer(file);
  };
  input.click();
}

// ==================== CAMERA FUNCTIONS ====================
let currentStream=null;
function openCameraForAttendance(){document.getElementById('cameraModal').classList.add('active');navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(s=>{currentStream=s;document.getElementById('video').srcObject=s;}).catch(()=>showToast('دسترسی به دوربین ممکن نیست',true));}
function closeCamera(){document.getElementById('cameraModal').classList.remove('active');if(currentStream){currentStream.getTracks().forEach(t=>t.stop());currentStream=null;}}
function capturePhoto(){const aiResult=document.getElementById('aiResult');aiResult.classList.remove('hidden');aiResult.innerHTML=`<div class="bg-green-100 p-4 rounded"><i class="fas fa-robot text-2xl"></i><p>AI در حال تشخیص...</p><div class="w-full bg-gray-200 rounded-full h-2 mt-2"><div class="bg-emerald-600 h-2 rounded-full animate-pulse" style="width:70%"></div></div></div>`;setTimeout(()=>{aiResult.innerHTML=`<div class="bg-green-100 p-4 rounded"><i class="fas fa-check-circle text-2xl"></i><p>✅ AI شناسایی کامل شد!</p><button onclick="applyAIAttendance()" class="mt-2 bg-emerald-600 text-white px-4 py-2 rounded">اعمال حاضری</button></div>`;},3000);}
function uploadFromGallery(){const input=document.createElement('input');input.type='file';input.accept='image/*';input.click();}
function applyAIAttendance(){closeCamera();showToast('حاضری توسط AI ثبت شد');}
function exportToExcel(){const journal=JSON.parse(localStorage.getItem(STORAGE.JOURNAL));const ws=XLSX.utils.aoa_to_sheet([['تاریخ','شرح','بدهکار','بستانکار'],...journal.map(j=>[new Date(j.date).toLocaleDateString('fa-IR'),j.description,j.debit||0,j.credit||0])]);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'گزارش');XLSX.writeFile(wb,`report_${new Date().toISOString().split('T')[0]}.xlsx`);showToast('Excel دانلود شد');}

window.collectStudentFee=collectStudentFee; window.showStudentForm=showStudentForm;
window.saveStudent=saveStudent; window.showStudentList=showStudentList;
window.showTeacherAttendance=showTeacherAttendance; window.loadAttendanceStudents=loadAttendanceStudents;
window.markPresent=markPresent; window.markAbsent=markAbsent; window.saveAttendance=saveAttendance;
window.uploadExamExcel=uploadExamExcel; window.openCameraForAttendance=openCameraForAttendance;
window.closeCamera=closeCamera; window.capturePhoto=capturePhoto;
window.uploadFromGallery=uploadFromGallery; window.applyAIAttendance=applyAIAttendance;
window.exportToExcel=exportToExcel;

initData();
setLang(currentLang);
const savedUser = localStorage.getItem('currentUser');
if(savedUser){
  const data = JSON.parse(savedUser);
  const users = JSON.parse(localStorage.getItem(STORAGE.USERS));
  currentUser = users.find(u=>u.id===data.id);
  if(currentUser){
    currentRole = currentUser.role;

    document.getElementById('logoutBtn').style.display='block';
    document.getElementById('userName').textContent = `${currentUser.firstName} ${currentUser.lastName}`;
    document.getElementById('userRole').textContent = t(currentUser.role);
    renderDashboard();
  } else { document.getElementById('roleSelection').style.display='grid'; }
} else { document.getElementById('roleSelection').style.display='grid'; }
</script>
