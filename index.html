<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#059669">
  <title>سیستم مدیریت مکتب - نسخه کامل</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * { font-family: 'Vazirmatn', sans-serif; }
    body { background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); min-height: 100vh; }
    .card-hover { transition: all 0.3s ease; }
    .card-hover:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -12px rgba(0,0,0,0.2); }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
    .modal.active { display: flex; }
    .toast { position: fixed; bottom: 20px; right: 20px; background: #333; color: white; padding: 12px 20px; border-radius: 8px; z-index: 2000; display: none; }
    .lang-btn.active { background: #059669; color: white; }
    .rtl { direction: rtl; }
    .ltr { direction: ltr; }
    .ad-card { border: 2px solid #fbbf24; background: linear-gradient(135deg, #fffbeb, #fef3c7); }
    .camera-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 3000; display: none; flex-direction: column; }
    .camera-modal.active { display: flex; }
    video { width: 100%; height: 60%; object-fit: cover; }
  </style>
</head>
<body class="rtl">

<div id="toast" class="toast"></div>

<!-- Camera Modal -->
<div id="cameraModal" class="camera-modal">
  <div class="flex justify-between p-4 bg-gray-900 text-white">
    <h3 id="cameraTitle">گرفتن عکس حاضری</h3>
    <button onclick="closeCamera()" class="text-white text-xl">&times;</button>
  </div>
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" style="display: none;"></canvas>
  <div class="p-4 bg-gray-900 flex gap-3">
    <button onclick="capturePhoto()" class="flex-1 bg-green-600 text-white py-3 rounded-lg">📸 گرفتن عکس</button>
    <button onclick="uploadFromGallery()" class="flex-1 bg-blue-600 text-white py-3 rounded-lg">🖼 انتخاب از گالری</button>
  </div>
  <div id="aiResult" class="p-4 bg-white dark:bg-gray-800 hidden"></div>
</div>

<!-- Main App -->
<div id="app" class="container mx-auto px-4 py-6 max-w-7xl">
  
  <!-- Header -->
  <div class="flex justify-between items-center mb-6 flex-wrap gap-3">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 bg-gradient-to-br from-emerald-600 to-teal-600 rounded-2xl flex items-center justify-center shadow-lg">
        <i class="fas fa-school text-white text-2xl"></i>
      </div>
      <div>
        <h1 id="appTitle" class="text-2xl font-bold text-emerald-800">سیستم مدیریت مکتب</h1>
        <p class="text-xs text-gray-500">نسخه کامل - آفلاین</p>
      </div>
    </div>
    <div class="flex gap-2">
      <div class="flex bg-white rounded-lg shadow">
        <button onclick="setLang('dari')" id="langDari" class="px-3 py-2 text-sm lang-btn active">دری</button>
        <button onclick="setLang('pashto')" id="langPashto" class="px-3 py-2 text-sm lang-btn">پښتو</button>
        <button onclick="setLang('english')" id="langEnglish" class="px-3 py-2 text-sm lang-btn">English</button>
      </div>
      <div id="userInfo" class="bg-white rounded-lg shadow px-4 py-2 flex items-center gap-2">
        <i class="fas fa-user-circle text-emerald-600 text-xl"></i>
        <span id="userName" class="font-medium"></span>
        <span id="userRole" class="text-xs text-gray-500"></span>
      </div>
      <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600">خروج</button>
    </div>
  </div>
  
  <!-- Role Cards -->
  <div id="roleSelection" class="grid md:grid-cols-4 gap-6 mb-8">
    <div onclick="selectRole('principal')" class="bg-white rounded-2xl p-6 shadow-lg card-hover cursor-pointer text-center">
      <div class="w-16 h-16 bg-amber-500 rounded-2xl flex items-center justify-center mx-auto mb-4"><i class="fas fa-crown text-white text-3xl"></i></div>
      <h3 class="text-xl font-bold">مدیر مکتب</h3>
      <p class="text-sm text-gray-500">مدیریت کامل، تبلیغات، گزارشات</p>
    </div>
    <div onclick="selectRole('finance')" class="bg-white rounded-2xl p-6 shadow-lg card-hover cursor-pointer text-center">
      <div class="w-16 h-16 bg-emerald-500 rounded-2xl flex items-center justify-center mx-auto mb-4"><i class="fas fa-chart-line text-white text-3xl"></i></div>
      <h3 class="text-xl font-bold">مدیر مالی</h3>
      <p class="text-sm text-gray-500">دریافت شهریه، حسابداری</p>
    </div>
    <div onclick="selectRole('headteacher')" class="bg-white rounded-2xl p-6 shadow-lg card-hover cursor-pointer text-center">
      <div class="w-16 h-16 bg-blue-500 rounded-2xl flex items-center justify-center mx-auto mb-4"><i class="fas fa-chalkboard-user text-white text-3xl"></i></div>
      <h3 class="text-xl font-bold">استاد سر</h3>
      <p class="text-sm text-gray-500">مدیریت شاگردان، فرم‌ها</p>
    </div>
    <div onclick="selectRole('teacher')" class="bg-white rounded-2xl p-6 shadow-lg card-hover cursor-pointer text-center">
      <div class="w-16 h-16 bg-purple-500 rounded-2xl flex items-center justify-center mx-auto mb-4"><i class="fas fa-person-chalkboard text-white text-3xl"></i></div>
      <h3 class="text-xl font-bold">استاد</h3>
      <p class="text-sm text-gray-500">حاضری، امتحانات</p>
    </div>
  </div>
  
  <div id="dashboardContainer"></div>
</div>

<!-- Login Modal -->
<div id="loginModal" class="modal">
  <div class="bg-white rounded-2xl p-8 max-w-md w-full mx-4 shadow-2xl">
    <div class="text-center mb-6">
      <div class="w-20 h-20 bg-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-4"><i class="fas fa-graduation-cap text-white text-4xl"></i></div>
      <h2 class="text-2xl font-bold">ورود به سیستم</h2>
    </div>
    <form onsubmit="handleLogin(event)">
      <input type="email" id="loginEmail" placeholder="ایمیل" required class="w-full border rounded-lg p-3 mb-3 ltr">
      <input type="password" id="loginPassword" placeholder="رمز عبور" required class="w-full border rounded-lg p-3 mb-4 ltr">
      <button type="submit" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-semibold">ورود</button>
    </form>
    <div class="text-center mt-4"><button onclick="showSignup()" class="text-emerald-600">حساب ندارید؟ ثبت نام</button></div>
  </div>
</div>

<!-- Signup Modal - نقش استاد REMOVED from signup -->
<div id="signupModal" class="modal">
  <div class="bg-white rounded-2xl p-8 max-w-2xl w-full mx-4 shadow-2xl max-h-[90vh] overflow-y-auto">
    <h2 class="text-2xl font-bold text-center mb-6">ثبت نام</h2>
    <form onsubmit="handleSignup(event)" class="space-y-4">
      <div class="grid md:grid-cols-2 gap-4">
        <input type="text" id="signupFirstName" placeholder="نام" required class="border rounded-lg p-3">
        <input type="text" id="signupLastName" placeholder="نام خانوادگی" required class="border rounded-lg p-3">
      </div>
      <input type="email" id="signupEmail" placeholder="ایمیل" required class="w-full border rounded-lg p-3 ltr">
      <input type="tel" id="signupPhone" placeholder="شماره تماس" required class="w-full border rounded-lg p-3 ltr">
      <input type="text" id="signupSchool" placeholder="نام مکتب" required class="w-full border rounded-lg p-3">
      <input type="password" id="signupPassword" placeholder="رمز عبور" required class="w-full border rounded-lg p-3 ltr">
      
      <!-- CHANGE 1: نقش استاد REMOVED from signup -->
      <select id="signupRole" class="w-full border rounded-lg p-3">
        <option value="principal">مدیر مکتب</option>
        <option value="finance">مدیر مالی</option>
        <option value="headteacher">استاد سر</option>
      </select>
      
      <button type="submit" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-semibold">ثبت نام</button>
    </form>
    <div class="text-center mt-4"><button onclick="showLogin()" class="text-emerald-600">قبلاً حساب دارید؟ وارد شوید</button></div>
  </div>
</div>

<script>
// ==================== STORAGE KEYS ====================
const STORAGE = {
  USERS: 'school_users_complete_final',
  STUDENTS: 'school_students_complete_final',
  TEACHERS: 'school_teachers_complete_final',
  CLASSES: 'school_classes_complete_final',
  SUBJECTS: 'school_subjects_complete_final',
  HOMEWORK: 'school_homework_complete_final',
  ATTENDANCE: 'school_attendance_complete_final',
  SALARIES: 'school_salaries_complete_final',
  FEES: 'school_fees_complete_final',
  JOURNAL: 'school_journal_complete_final',
  AD_PACKAGES: 'school_ad_packages_complete_final',
  AD_PURCHASES: 'school_ad_purchases_complete_final',
  TEMP_STUDENTS: 'school_temp_students_complete_final',
  CONDITIONAL: 'school_conditional_complete_final',
  BANNED: 'school_banned_complete_final',
  TRANSFERS: 'school_transfers_complete_final'
};

let currentUser = null;
let currentRole = null;
let currentLang = localStorage.getItem('lang') || 'dari';

const translations = {
  dari: { principal: "مدیر مکتب", finance: "مدیر مالی", headteacher: "استاد سر", teacher: "استاد", attendance: "حاضری", salary: "معاش", profit: "سود", loss: "زیان", journal: "ژورنال", advertising: "تبلیغات", selectClass: "انتخاب صنف", present: "حاضر", absent: "غایب", save: "ذخیره", delete: "حذف", newEnrollment: "فورم جدید الشمول", temporary: "شاگردان موقت", conditional: "شاگردان مشروط", banned: "محرومین سه ساله", baseBook: "کتاب اساس", transfer: "جدول رفت و آمد" },
  pashto: { principal: "د مکتب مدیر", finance: "مالي مدیر", headteacher: "لومړی استاد", teacher: "استاد", attendance: "حاضرتی", salary: "معاش", profit: "ګټه", loss: "زیان", journal: "ژورنال", advertising: "اعلانات", selectClass: "صنف انتخاب کړئ", present: "حاضر", absent: "غایب", save: "خوندي کول", delete: "ړنګول", newEnrollment: "د نوي شاملیدو فورم", temporary: "عارضي زده کونکي", conditional: "مشروط زده کونکي", banned: "د درې کلونو محروم", baseBook: "اساسی کتاب", transfer: "د تګ راتګ جدول" },
  english: { principal: "Principal", finance: "Finance Manager", headteacher: "Head Teacher", teacher: "Teacher", attendance: "Attendance", salary: "Salary", profit: "Profit", loss: "Loss", journal: "Journal", advertising: "Advertising", selectClass: "Select Class", present: "Present", absent: "Absent", save: "Save", delete: "Delete", newEnrollment: "New Enrollment Form", temporary: "Temporary Students", conditional: "Conditional Students", banned: "3-Year Banned", baseBook: "Base Book", transfer: "Transfer Table" }
};

function t(key) { return translations[currentLang][key] || key; }

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('lang', lang);
  document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById(`lang${lang.charAt(0).toUpperCase() + lang.slice(1)}`).classList.add('active');
  document.getElementById('appTitle').textContent = "سیستم مدیریت مکتب";
  if (currentRole) renderDashboard();
}

function showToast(msg, isError = false) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.style.background = isError ? '#dc2626' : '#059669';
  toast.style.display = 'block';
  setTimeout(() => toast.style.display = 'none', 3000);
}

// ==================== INIT DATA ====================
function initData() {
  if (!localStorage.getItem(STORAGE.USERS)) {
    localStorage.setItem(STORAGE.USERS, JSON.stringify([
      { id: '1', email: 'admin@school.com', password: 'admin123', firstName: 'مدیر', lastName: 'سیستم', phone: '0770000000', school: 'مکتب نمونه', role: 'principal' }
    ]));
  }
  if (!localStorage.getItem(STORAGE.CLASSES)) {
    localStorage.setItem(STORAGE.CLASSES, JSON.stringify([
      { id: '1', name: 'صنف ۶', gradeLevel: 6 },
      { id: '2', name: 'صنف ۷', gradeLevel: 7 },
      { id: '3', name: 'صنف ۸', gradeLevel: 8 },
      { id: '4', name: 'صنف ۹', gradeLevel: 9 },
      { id: '5', name: 'صنف ۱۰', gradeLevel: 10 }
    ]));
  }
  if (!localStorage.getItem(STORAGE.SUBJECTS)) {
    localStorage.setItem(STORAGE.SUBJECTS, JSON.stringify([
      { id: '1', name: 'دری', fullMarks: 100 },
      { id: '2', name: 'پښتو', fullMarks: 100 },
      { id: '3', name: 'ریاضی', fullMarks: 100 },
      { id: '4', name: 'علوم', fullMarks: 100 },
      { id: '5', name: 'انگلیسی', fullMarks: 100 }
    ]));
  }
  if (!localStorage.getItem(STORAGE.TEACHERS)) localStorage.setItem(STORAGE.TEACHERS, JSON.stringify([]));
  if (!localStorage.getItem(STORAGE.STUDENTS)) localStorage.setItem(STORAGE.STUDENTS, JSON.stringify([]));
  if (!localStorage.getItem(STORAGE.HOMEWORK)) localStorage.setItem(STORAGE.HOMEWORK, JSON.stringify([]));
  if (!localStorage.getItem(STORAGE.ATTENDANCE)) localStorage.setItem(STORAGE.ATTENDANCE, JSON.stringify([]));
  if (!localStorage.getItem(STORAGE.SALARIES)) localStorage.setItem(STORAGE.SALARIES, JSON.stringify([]));
  if (!localStorage.getItem(STORAGE.FEES)) localStorage.setItem(STORAGE.FEES, JSON.stringify([]));
  if (!localStorage.getItem(STORAGE.JOURNAL)) localStorage.setItem(STORAGE.JOURNAL, JSON.stringify([]));
  if (!localStorage.getItem(STORAGE.AD_PACKAGES)) {
    localStorage.setItem(STORAGE.AD_PACKAGES, JSON.stringify([
      { id: '1', name: 'پکیج یک ماهه', months: 1, priceUSD: 10, priceAFN: 850 },
      { id: '2', name: 'پکیج دو ماهه', months: 2, priceUSD: 18, priceAFN: 1530 },
      { id: '3', name: 'پکیج سه ماهه', months: 3, priceUSD: 25, priceAFN: 2125 }
    ]));
  }
  if (!localStorage.getItem(STORAGE.AD_PURCHASES)) localStorage.setItem(STORAGE.AD_PURCHASES, JSON.stringify([]));
  if (!localStorage.getItem(STORAGE.TEMP_STUDENTS)) localStorage.setItem(STORAGE.TEMP_STUDENTS, JSON.stringify([]));
  if (!localStorage.getItem(STORAGE.CONDITIONAL)) localStorage.setItem(STORAGE.CONDITIONAL, JSON.stringify([]));
  if (!localStorage.getItem(STORAGE.BANNED)) localStorage.setItem(STORAGE.BANNED, JSON.stringify([]));
  if (!localStorage.getItem(STORAGE.TRANSFERS)) localStorage.setItem(STORAGE.TRANSFERS, JSON.stringify([]));
}

// ==================== AUTH ====================
function showLogin() {
  document.getElementById('loginModal').classList.add('active');
  document.getElementById('signupModal').classList.remove('active');
}
function showSignup() {
  document.getElementById('signupModal').classList.add('active');
  document.getElementById('loginModal').classList.remove('active');
}

function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const users = JSON.parse(localStorage.getItem(STORAGE.USERS));
  const user = users.find(u => u.email === email && u.password === password);
  if (user) {
    currentUser = user;
    currentRole = user.role;
    localStorage.setItem('currentUser', JSON.stringify({ id: user.id, role: user.role }));
    document.getElementById('loginModal').classList.remove('active');
    document.getElementById('userName').textContent = `${user.firstName} ${user.lastName}`;
    document.getElementById('userRole').textContent = t(user.role);
    document.getElementById('roleSelection').style.display = 'grid';
    showToast(`خوش آمدید ${user.firstName}`);
  } else showToast('ایمیل یا رمز اشتباه است', true);
}

function handleSignup(e) {
  e.preventDefault();
  const firstName = document.getElementById('signupFirstName').value;
  const lastName = document.getElementById('signupLastName').value;
  const email = document.getElementById('signupEmail').value;
  const phone = document.getElementById('signupPhone').value;
  const school = document.getElementById('signupSchool').value;
  const password = document.getElementById('signupPassword').value;
  const role = document.getElementById('signupRole').value;
  const users = JSON.parse(localStorage.getItem(STORAGE.USERS));
  if (users.find(u => u.email === email)) return showToast('این ایمیل قبلاً ثبت شده است', true);
  
  const newUser = { id: Date.now().toString(), firstName, lastName, email, phone, school, password, role };
  users.push(newUser);
  localStorage.setItem(STORAGE.USERS, JSON.stringify(users));
  showToast('حساب ایجاد شد! وارد شوید');
  showLogin();
}

function logout() {
  currentUser = null; currentRole = null;
  localStorage.removeItem('currentUser');
  document.getElementById('roleSelection').style.display = 'grid';
  document.getElementById('dashboardContainer').innerHTML = '';
  showLogin();
}

function selectRole(role) {
  currentRole = role;
  document.getElementById('roleSelection').style.display = 'none';
  renderDashboard();
}

// ==================== DASHBOARD RENDERER ====================
function renderDashboard() {
  const container = document.getElementById('dashboardContainer');
  if (currentRole === 'principal') renderPrincipal(container);
  else if (currentRole === 'finance') renderFinance(container);
  else if (currentRole === 'headteacher') renderHeadTeacher(container);
  else if (currentRole === 'teacher') renderTeacher(container);
}

// ==================== PRINCIPAL DASHBOARD ====================
function renderPrincipal(container) {
  container.innerHTML = `
    <div class="bg-white rounded-2xl p-6 shadow-lg mb-6">
      <div class="flex justify-between"><h2 class="text-2xl font-bold"><i class="fas fa-crown text-amber-500 ml-2"></i> ${t('principal')}</h2><button onclick="selectRole(null)" class="bg-gray-500 text-white px-4 py-2 rounded-lg">تغییر نقش</button></div>
    </div>
    <div class="grid md:grid-cols-4 gap-4 mb-6">
      <div onclick="showClassesTeachers()" class="bg-white p-5 rounded-xl shadow card-hover cursor-pointer text-center"><i class="fas fa-chalkboard text-3xl text-blue-600 mb-2"></i><h3 class="font-bold">صنف‌ها و معلمین</h3></div>
      <div onclick="showSalarySection()" class="bg-white p-5 rounded-xl shadow card-hover cursor-pointer text-center"><i class="fas fa-money-bill text-3xl text-green-600 mb-2"></i><h3 class="font-bold">${t('salary')}</h3></div>
      <div onclick="showAdvertisingSystem()" class="bg-white ad-card p-5 rounded-xl shadow card-hover cursor-pointer text-center"><i class="fas fa-ad text-3xl text-amber-600 mb-2"></i><h3 class="font-bold">${t('advertising')}</h3><span class="text-xs">از 10$</span></div>
      <div onclick="showProfitLossReport()" class="bg-white p-5 rounded-xl shadow card-hover cursor-pointer text-center"><i class="fas fa-chart-line text-3xl text-emerald-600 mb-2"></i><h3 class="font-bold">گزارش سود/زیان</h3></div>
    </div>
    <div id="principalContent" class="bg-white rounded-2xl p-6 shadow-lg"></div>
  `;
}

function showClassesTeachers() {
  const classes = JSON.parse(localStorage.getItem(STORAGE.CLASSES));
  const teachers = JSON.parse(localStorage.getItem(STORAGE.TEACHERS));
  const content = document.getElementById('principalContent');
  content.innerHTML = `<h3 class="text-xl font-bold mb-4">صنف‌ها و معلمین</h3><div class="overflow-x-auto"><table class="w-full"><thead><tr class="bg-gray-100"><th class="p-3 text-right">صنف</th><th class="p-3 text-right">معلم</th><th class="p-3 text-right">مضمون‌ها</th></tr></thead><tbody>${classes.map(c => { const tchs = teachers.filter(t => t.classes && t.classes.includes(c.name)); return `<tr class="border-b"><td class="p-3 font-bold">${c.name}</td><td class="p-3">${tchs.map(t => t.fullName).join(', ') || 'تعیین نشده'}</td><td class="p-3">${tchs.map(t => t.subjects).join(', ') || '-'}</td></tr>`; }).join('')}</tbody></tr></div>`;
}

function showSalarySection() {
  const teachers = JSON.parse(localStorage.getItem(STORAGE.TEACHERS));
  const content = document.getElementById('principalContent');
  content.innerHTML = `<h3 class="text-xl font-bold mb-4">${t('salary')}</h3><div class="overflow-x-auto"><table class="w-full"><thead><tr class="bg-gray-100"><th class="p-3">نام استاد</th><th class="p-3">مضمون‌ها</th><th class="p-3">معاش پایه</th><th class="p-3">ماه</th><th class="p-3"></th></tr></thead><tbody>${teachers.map(t => `<tr class="border-b"><td class="p-3">${t.fullName}</td><td class="p-3">${t.subjects || '-'}</td><td class="p-3"><input type="number" id="sal_${t.id}" value="${t.salary || 5000}" class="border rounded p-1 w-24"> افغانی</td><td class="p-3"><select id="month_${t.id}">${['جنوری','فبروری','مارچ','اپریل','می','جون','جولای','آگست','سپتامبر','اکتوبر','نومبر','دسمبر'].map((m,i)=>`<option value="${i+1}">${m}</option>`).join('')}</select></td><td class="p-3"><button onclick="paySalary('${t.id}')" class="bg-green-600 text-white px-3 py-1 rounded">پرداخت</button></td></tr>`).join('')}</tbody></table></div>`;
}

function paySalary(teacherId) {
  const amount = parseInt(document.getElementById(`sal_${teacherId}`).value);
  const month = document.getElementById(`month_${teacherId}`).value;
  if (!amount) return showToast('مبلغ را وارد کنید', true);
  const salaries = JSON.parse(localStorage.getItem(STORAGE.SALARIES));
  salaries.push({ id: Date.now().toString(), teacherId, amount, month: parseInt(month), year: new Date().getFullYear(), date: new Date().toISOString() });

function buyAdPackage(packageId, priceUSD, packageName, months) {
  const priceAFN = priceUSD * 85;
  const purchases = JSON.parse(localStorage.getItem(STORAGE.AD_PURCHASES));
  const expiryDate = new Date();
  expiryDate.setMonth(expiryDate.getMonth() + months);
  purchases.push({ 
    id: Date.now().toString(), 
    packageId, 
    packageName, 
    amountUSD: priceUSD, 
    amountAFN: priceAFN, 
    months: months,
    date: new Date().toISOString(), 
    expiryDate: expiryDate.toISOString() 
  });
  localStorage.setItem(STORAGE.AD_PURCHASES, JSON.stringify(purchases));
  const journal = JSON.parse(localStorage.getItem(STORAGE.JOURNAL));
  journal.push({ id: Date.now().toString(), date: new Date().toISOString(), description: `خرید ${packageName} تبلیغات`, debit: 0, credit: priceAFN });
  localStorage.setItem(STORAGE.JOURNAL, JSON.stringify(journal));
  showToast(`پکیج ${packageName} با موفقیت خریداری شد`);
  showAdvertisingSystem();
}

function renderStudentRows(students, fees) {
  return students.map(s => { 
    const paid = fees.filter(f => f.studentId === s.id && f.type !== 'salary').reduce((sum, f) => sum + f.amount, 0); 
    const remaining = (s.monthlyFee || 1000) - paid; 
    return `<tr class="border-b"><td class="p-2">${s.fullName}</td><td class="p-2">${s.fatherName || '-'}</td><td class="p-2">${s.tazkira || '-'}/${s.age || '-'}</td><td class="p-2">${s.fatherJob || '-'}</td><td class="p-2">${s.currentProvince || '-'}/${s.currentDistrict || '-'}/${s.currentVillage || '-'}</td><td class="p-2">${s.originalProvince || '-'}</td><td class="p-2">${s.relativeName || '-'}<br><small class="text-gray-500">(${s.relationship || '-'})</small></td><td class="p-2">${s.relativePhone || s.parentPhone || '-'}</td><td class="p-2">${s.monthlyFee || 1000} افغانی</td><td class="p-2 text-green-600">${paid} افغانی</td><td class="p-2 ${remaining > 0 ? 'text-red-600' : 'text-green-600'}">${remaining} افغانی</td><td class="p-2"><input type="number" id="fee_${s.id}" class="w-20 border rounded p-1" placeholder="مبلغ"><button onclick="collectFee('${s.id}', '${s.fullName}')" class="bg-emerald-600 text-white px-2 py-1 rounded text-sm">دریافت</button></td></tr>`;

function filterStudentsByClass() {

function collectFee(studentId, studentName) {
  const amount = parseInt(document.getElementById(`fee_${studentId}`).value);
  if (!amount || amount <= 0) return showToast('مبلغ معتبر وارد کنید', true);
  const fees = JSON.parse(localStorage.getItem(STORAGE.FEES));
  fees.push({ id: Date.now().toString(), studentId, amount, type: 'fee', date: new Date().toISOString() });
  localStorage.setItem(STORAGE.FEES, JSON.stringify(fees));
  const journal = JSON.parse(localStorage.getItem(STORAGE.JOURNAL));
  journal.push({ id: Date.now().toString(), date: new Date().toISOString(), description: `دریافت شهریه از ${studentName} به مبلغ ${amount} افغانی`, debit: 0, credit: amount });

  showToast(`مبلغ ${amount} افغانی از ${studentName} دریافت شد`);
  filterStudentsByClass();
}

  const classId = document.getElementById('attClass').value;

  document.getElementById('attendanceList').innerHTML = `<div class="grid md:grid-cols-2 gap-3 mt-4">${students.map(s => `<div class="flex justify-between items-center border rounded p-3"><span>${s.fullName} (نمبر: ${s.rollNumber})</span><div><button onclick="markPresentNow('${s.id}')" class="bg-green-500 text-white px-3 py-1 rounded ml-1">${t('present')}</button><button onclick="markAbsentNow('${s.id}')" class="bg-red-500 text-white px-3 py-1 rounded">${t('absent')}</button></div></div>`).join('')}</div><button onclick="saveTeacherAttendance()" class="mt-4 bg-emerald-600 text-white px-4 py-2 rounded-lg w-full">${t('save')}</button>`;

}

let tempAttendanceData = {};
function markPresentNow(id) { tempAttendanceData[id] = 'present'; showToast('حاضر ثبت شد'); }
function markAbsentNow(id) { tempAttendanceData[id] = 'absent'; showToast('غایب ثبت شد'); }

function saveTeacherAttendance() {
  const attendance = JSON.parse(localStorage.getItem(STORAGE.ATTENDANCE));
  const classId = document.getElementById('attClass').value;
  const today = new Date().toISOString().split('T')[0];
  for (const [sid, status] of Object.entries(tempAttendanceData)) {
    attendance.push({ id: Date.now().toString() + sid, studentId: sid, classId, date: today, status });
    if (status === 'absent') {
      const students = JSON.parse(localStorage.getItem(STORAGE.STUDENTS));
      const student = students.find(s => s.id === sid);
      if (student && student.parentPhone) {
        showToast(`اطلاعیه غیابی به شماره ${student.parentPhone} ارسال شد`);
      }
    }
  }
  localStorage.setItem(STORAGE.ATTENDANCE, JSON.stringify(attendance));
  showToast('حاضری ثبت و به والدین اطلاع داده شد');
  tempAttendanceData = {};
  loadAttendanceStudents();
}

function uploadExamExcel() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.xlsx,.xls';
  input.onchange = (e) => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = (evt) => {
      const data = new Uint8Array(evt.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet);
      localStorage.setItem('uploaded_exam_data', JSON.stringify(json));
      showToast(`Excel آپلود شد! ${json.length} رکورد یافت شد`);
    };
    reader.readAsArrayBuffer(file);
  };
  input.click();
}

// Camera functions
let currentStream = null;
function openCameraForAttendance() {
  const modal = document.getElementById('cameraModal');
  const video = document.getElementById('video');
  modal.classList.add('active');
  try {
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(stream => {
      currentStream = stream;
      video.srcObject = stream;
    }).catch(() => showToast('دسترسی به دوربین ممکن نیست', true));
  } catch(err) { showToast('خطا در دسترسی به دوربین', true); }
}
function closeCamera() {
  const modal = document.getElementById('cameraModal');
  modal.classList.remove('active');
  if (currentStream) { currentStream.getTracks().forEach(track => track.stop()); currentStream = null; }
}
function capturePhoto() {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const aiResult = document.getElementById('aiResult');
  aiResult.classList.remove('hidden');
  aiResult.innerHTML = `<div class="bg-green-100 p-4 rounded"><i class="fas fa-robot text-2xl text-emerald-600"></i><p>AI در حال تشخیص چهره شاگردان...</p><div class="w-full bg-gray-200 rounded-full h-2 mt-2"><div class="bg-emerald-600 h-2 rounded-full animate-pulse" style="width: 70%"></div></div></div>`;
  setTimeout(() => {
    aiResult.innerHTML = `<div class="bg-green-100 p-4 rounded"><i class="fas fa-check-circle text-2xl text-green-600"></i><p>✅ AI با موفقیت شاگردان را شناسایی کرد</p><button onclick="applyAIAttendance()" class="mt-2 bg-emerald-600 text-white px-4 py-2 rounded">اعمال حاضری</button></div>`;
  }, 3000);
}
function uploadFromGallery() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = () => showToast('تصویر انتخاب شد، AI در حال پردازش...');
  input.click();
}
function applyAIAttendance() { closeCamera(); showToast('حاضری توسط AI ثبت شد'); }

// Export functions
function exportToExcel() {
  const journal = JSON.parse(localStorage.getItem(STORAGE.JOURNAL));
  const ws = XLSX.utils.aoa_to_sheet([['تاریخ', 'شرح', 'بدهکار', 'بستانکار'], ...journal.map(j => [new Date(j.date).toLocaleDateString('fa-IR'), j.description, j.debit || 0, j.credit || 0])]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'گزارش مالی');
  XLSX.writeFile(wb, `financial_report_${new Date().toISOString().split('T')[0]}.xlsx`);
  showToast('Excel دانلود شد');
}
function exportToPDF() {
  const element = document.getElementById('financeContent') || document.getElementById('principalContent');
  if (element) html2pdf().from(element).set({ filename: 'report.pdf' }).save();
}
