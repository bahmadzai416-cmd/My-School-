<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1E3A8A">
    <link rel="manifest" href="manifest.json">
    <title>My School Search | AI School Management</title>
    <!-- CDN Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            color: #f1f5f9;
            direction: rtl;
        }

        /* Glassmorphism & Animations */
        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.12);
        }

        button, .btn {
            background: linear-gradient(45deg, #3b82f6, #8b5cf6);
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
        }

        button:hover {
            opacity: 0.9;
            transform: scale(0.98);
        }

        input, select, textarea {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #475569;
            border-radius: 24px;
            padding: 12px 18px;
            color: white;
            width: 100%;
            margin: 8px 0;
            outline: none;
        }

        .sidebar {
            position: fixed;
            right: -280px;
            top: 0;
            width: 280px;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            z-index: 1000;
            transition: 0.3s;
            padding: 20px;
            border-left: 1px solid #334155;
        }

        .sidebar.open {
            right: 0;
        }

        .mobile-header {
            display: flex;
            justify-content: space-between;
            padding: 16px;
            background: rgba(0,0,0,0.3);
        }

        .dashboard-container {
            padding: 20px;
            max-width: 1400px;
            margin: auto;
        }

        .grid-2, .grid-3 {
            display: grid;
            gap: 20px;
        }

        .grid-2 { grid-template-columns: repeat(auto-fit, minmax(300px,1fr)); }
        .grid-3 { grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); }

        @media (max-width: 600px) {
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
        }

        .attendance-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
        }

        .theme-toggle {
            background: #334155;
            border-radius: 50px;
            padding: 8px 15px;
        }

        .notification-toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #1e293b;
            border-right: 5px solid #3b82f6;
            padding: 12px 20px;
            border-radius: 16px;
            z-index: 1100;
            animation: fadeInUp 0.3s;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px);}
            to { opacity: 1; transform: translateY(0);}
        }
    </style>
</head>
<body>
<div id="appRoot"></div>

<script>
    // ---------- Mock Database (localStorage) ----------
    let db = {
        users: JSON.parse(localStorage.getItem('mss_users')) || [],
        attendance: JSON.parse(localStorage.getItem('mss_attendance')) || [],
        marks: JSON.parse(localStorage.getItem('mss_marks')) || [],
        exams: JSON.parse(localStorage.getItem('mss_exams')) || [],
        fees: JSON.parse(localStorage.getItem('mss_fees')) || [],
        timetable: JSON.parse(localStorage.getItem('mss_timetable')) || {}
    };

    function saveDB() {
        localStorage.setItem('mss_users', JSON.stringify(db.users));
        localStorage.setItem('mss_attendance', JSON.stringify(db.attendance));
        localStorage.setItem('mss_marks', JSON.stringify(db.marks));
        localStorage.setItem('mss_exams', JSON.stringify(db.exams));
        localStorage.setItem('mss_fees', JSON.stringify(db.fees));
        localStorage.setItem('mss_timetable', JSON.stringify(db.timetable));
    }

    let currentUser = null;
    let currentRole = null;

    // Helper: showNotification
    function notify(msg, type="info") {
        const toast = document.createElement('div');
        toast.className = 'notification-toast glass-card';
        toast.innerHTML = `<i class="fas fa-bell"></i> ${msg}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    // ---------- AI simulation functions ----------
    function aiChatbotSim(query) {
        return `AI 🤖: "${query}" — Based on analytics, student performance improves by 23% with consistent attendance.`;
    }
    function aiAttendancePrediction(classId) {
        return Math.floor(Math.random() * 30) + 65; // 65-95% predicted
    }
    function aiStudentAnalysis(studentId) {
        return { focus: "Mathematics", improvement: "High potential in Science", risk: "Low" };
    }
    function aiOCRSimulate(file) {
        return new Promise((resolve) => {
            setTimeout(() => {
                resolve({ students: ["Ali Ahmad", "Fatima Z"], marks: [85,92], roll: [101,102] });
            }, 1500);
        });
    }

    // ---------- Render Main based on Auth ----------
    function render() {
        if (!currentUser) {
            renderAuthScreen();
        } else {
            switch(currentRole) {
                case 'admin': renderAdminDashboard(); break;
                case 'principal': renderPrincipalDashboard(); break;
                case 'finance_manager': renderFinanceDashboard(); break;
                case 'head_teacher': renderHeadTeacherDashboard(); break;
                case 'teacher': renderTeacherDashboard(); break;
                case 'student': renderStudentDashboard(); break;
                case 'parent': renderParentDashboard(); break;
                default: renderAuthScreen();
            }
        }
    }

    // ------ AUTHENTICATION (Signup / Login) ------
    function renderAuthScreen() {
        const html = `
        <div class="dashboard-container">
            <div class="glass-card" style="max-width:500px; margin:40px auto; padding:30px;">
                <h2 style="text-align:center;"><i class="fas fa-school"></i> My School Search</h2>
                <div id="authTabs">
                    <button id="showLoginBtn" class="btn" style="margin:5px;">ورود</button>
                    <button id="showSignupBtn" class="btn" style="background:#334155;">ثبت‌نام</button>
                </div>
                <div id="authFormContainer"></div>
            </div>
        </div>`;
        document.getElementById('appRoot').innerHTML = html;
        document.getElementById('showLoginBtn').onclick = () => showLoginForm();
        document.getElementById('showSignupBtn').onclick = () => showSignupForm();
        showLoginForm();
    }

    function showLoginForm() {
        const container = document.getElementById('authFormContainer');
        container.innerHTML = `
            <select id="loginRole">
                <option value="admin">Admin</option><option value="principal">Principal</option><option value="finance_manager">Finance Manager</option>
                <option value="head_teacher">Head Teacher</option><option value="teacher">Teacher</option>
                <option value="student">Student</option><option value="parent">Parent</option>
            </select>
            <input type="email" id="loginEmail" placeholder="ایمیل">
            <input type="password" id="loginPass" placeholder="رمز عبور">
            <button id="doLoginBtn" class="btn">ورود</button>
        `;
        document.getElementById('doLoginBtn').onclick = () => {
            const role = document.getElementById('loginRole').value;
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            const user = db.users.find(u => u.email === email && u.password === pass && u.role === role);
            if(user) {
                currentUser = user; currentRole = role;
                notify(`خوش آمدید ${user.firstName}`, "success");
                render();
            } else { alert("اطلاعات نادرست"); }
        };
    }

    function showSignupForm() {
        const container = document.getElementById('authFormContainer');
        container.innerHTML = `
            <select id="signupRole">
                <option value="admin">Admin</option><option value="principal">Principal</option><option value="finance_manager">Finance Manager</option>
                <option value="head_teacher">Head Teacher</option><option value="teacher">Teacher</option>
                <option value="student">Student</option><option value="parent">Parent</option>
            </select>
            <input id="signFName" placeholder="نام">
            <input id="signLName" placeholder="نام خانوادگی">
            <input id="signPhone" placeholder="شماره تلفن">
            <input id="signEmail" placeholder="ایمیل">
            <input id="signSchool" placeholder="نام مکتب">
            <input id="signPass" type="password" placeholder="رمز">
            <input id="signConfirmPass" type="password" placeholder="تایید رمز">
            <div id="dynamicFields"></div>
            <button id="doSignupBtn" class="btn">ثبت‌نام</button>
        `;
        const roleSelect = document.getElementById('signupRole');
        const dynamicDiv = document.getElementById('dynamicFields');
        function updateDynamic() {
            const role = roleSelect.value;
            if(role === 'teacher') {
                dynamicDiv.innerHTML = `<input id="teacherSubjects" placeholder="موضوعات (ریاضی,علوم)"><input id="teacherClasses" placeholder="کلاس‌ها (10,11)">`;
            } else if(role === 'principal') {
                dynamicDiv.innerHTML = `<input id="principalSchool" placeholder="نام مکتب (تکمیلی)">`;
            } else { dynamicDiv.innerHTML = ''; }
        }
        roleSelect.onchange = updateDynamic;
        updateDynamic();
        document.getElementById('doSignupBtn').onclick = () => {
            const role = roleSelect.value;
            const fname = document.getElementById('signFName').value;
            const lname = document.getElementById('signLName').value;
            const email = document.getElementById('signEmail').value;
            const pass = document.getElementById('signPass').value;
            const confirm = document.getElementById('signConfirmPass').value;
            if(pass !== confirm) { alert("رمزها مطابقت ندارند"); return; }
            const newUser = { id: Date.now(), firstName:fname, lastName:lname, phone:document.getElementById('signPhone').value, schoolName:document.getElementById('signSchool').value, email, password:pass, role, extra:{} };
            if(role === 'teacher') newUser.extra = { subjects: document.getElementById('teacherSubjects').value.split(','), classes: document.getElementById('teacherClasses').value.split(',') };
            if(role === 'principal') newUser.extra = { schoolConfirm: document.getElementById('principalSchool')?.value };
            db.users.push(newUser);
            saveDB();
            notify("ثبت‌نام موفق! اکنون وارد شوید");
            showLoginForm();
        };
    }

    // ----------------- DASHBOARDS (summary each role) -----------------
    function renderAdminDashboard() { renderGenericDashboard("پنل مدیریت (Admin) - مدیریت کامل سیستم", `<div class="grid-2"><div class="glass-card">AI Insights: ${aiChatbotSim("پیشرفت کلی")}</div><div class="glass-card">تعداد کاربران: ${db.users.length}</div></div><button onclick="logout()">خروج</button>`); }
    function renderPrincipalDashboard() { renderGenericDashboard("مدیر مکتب", `<div class="glass-card">گزارش مالی ماهانه: ${db.fees.reduce((a,b)=>a+b.amount,0)||0} AFN</div><button onclick="logout()">خروج</button>`); }
    function renderFinanceDashboard() { renderGenericDashboard("مدیر مالی", `<div class="glass-card">مدیریت هزینه‌ها و حقوق</div><button onclick="logout()">خروج</button>`); }
    function renderHeadTeacherDashboard() { renderGenericDashboard("معاون آموزشی", `<div class="glass-card">نظارت بر برنامه درسی و امتحانات</div>`); }
    function renderParentDashboard() { renderGenericDashboard("والدین", `<div class="glass-card">مشاهده کارنامه فرزند</div>`); }
    function renderStudentDashboard() { renderGenericDashboard("دانش‌آموز", `<div class="glass-card">نمرات و حضور و غیاب</div>`); }

    // ================== TEACHER DASHBOARD (complete) ==================
    function renderTeacherDashboard() {
        if(!currentUser) return;
        const teacherSubjects = currentUser.extra?.subjects || ['ریاضی', 'علوم'];
        const teacherClasses = currentUser.extra?.classes || ['10', '11'];
        let html = `
        <div class="dashboard-container">
            <div class="mobile-header"><h2><i class="fas fa-chalkboard-teacher"></i> پنل معلم: ${currentUser.firstName}</h2><button class="theme-toggle" id="darkToggle"><i class="fas fa-moon"></i></button><button onclick="logout()" class="btn">خروج</button></div>
            <div class="grid-3">
                <div class="glass-card"><h3>کلاس‌ها: ${teacherClasses.join(', ')}</h3><h3>موضوعات: ${teacherSubjects.join(', ')}</h3></div>
                <div class="glass-card"><h3>حضور و غیاب</h3><div id="attendancePanel"></div><button id="markAttendBtn">ثبت حضور</button></div>
                <div class="glass-card"><h3>مدیریت نمرات</h3><div id="marksPanel"></div><button id="addMarksBtn">ثبت نمره</button></div>
            </div>
            <div class="glass-card"><h3>برنامه هفتگی (قابل ویرایش)</h3><div id="timetableEditor"></div><button id="saveTimetable">ذخیره برنامه</button></div>
            <div class="glass-card"><h3>سیستم امتحانات (چهارنیم‌ماهه / سالانه)</h3><div id="examMgmt"></div><button id="genResultsBtn">تولید کارنامه</button></div>
            <div class="glass-card"><h3>AI Features</h3><button id="aiChatBtn">گفتگو با AI</button><button id="aiPredictBtn">پیش‌بینی حضور</button><button id="aiScanOCR">اسکن OCR هوشمند</button><button id="aiExcelBtn">بارگذاری Excel</button></div>
        </div>`;
        document.getElementById('appRoot').innerHTML = html;

        // Attendance UI
        const classSelect = teacherClasses[0];
        const studentList = db.users.filter(u => u.role === 'student' && u.schoolName === currentUser.schoolName);
        function loadAttendanceUI() {
            const panel = document.getElementById('attendancePanel');
            panel.innerHTML = studentList.map(s => `<div>${s.firstName} <select data-id="${s.id}" class="attStatus"><option>Present</option><option>Absent</option><option>Late</option></select></div>`).join('');
        }
        document.getElementById('markAttendBtn').onclick = () => {
            const selects = document.querySelectorAll('.attStatus');
            selects.forEach(sel => {
                const stuId = parseInt(sel.dataset.id);
                const status = sel.value;
                db.attendance.push({ studentId: stuId, date: new Date().toISOString().slice(0,10), status, class: classSelect });
                saveDB();
            });
            notify("حضور ثبت شد!");
            loadAttendanceUI();
        };
        loadAttendanceUI();

        // Marks management
        function loadMarksUI(){
            const marksContainer = document.getElementById('marksPanel');
            marksContainer.innerHTML = studentList.map(s => `<div>${s.firstName} <input type="number" placeholder="نمره" id="mark_${s.id}" step="0.5"></div>`).join('');
        }
        document.getElementById('addMarksBtn').onclick = () => {
            studentList.forEach(s => {
                let val = document.getElementById(`mark_${s.id}`)?.value;
                if(val) db.marks.push({ studentId:s.id, subject: teacherSubjects[0], marks: parseFloat(val), examType: "چهارنیم‌ماهه", date: new Date().toISOString() });
            });
            saveDB();
            notify("نمرات ثبت شد");
        };
        loadMarksUI();

        // Timetable editor (Mon-Sat)
        function loadTimetable() {
            let timetable = db.timetable[currentUser.id] || { Monday: [], Tuesday: [], Wednesday: [], Thursday: [], Friday: [], Saturday: [] };
            let editorHtml = `<table border="1" style="width:100%;color:white;"><tr><th>Day</th><th>Period 1</th><th>Period 2</th><th>Period 3</th></tr>`;
            const days = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
            days.forEach(day => {
                editorHtml += `<tr><td>${day}</td>${[0,1,2].map(p => `<td><input type="text" class="timetable-inp" data-day="${day}" data-period="${p}" value="${timetable[day][p] || ''}"></td>`).join('')}</tr>`;
            });
            editorHtml += `</table>`;
            document.getElementById('timetableEditor').innerHTML = editorHtml;
        }
        loadTimetable();
        document.getElementById('saveTimetable').onclick = () => {
            let newTT = { Monday:[],Tuesday:[],Wednesday:[],Thursday:[],Friday:[],Saturday:[] };
            document.querySelectorAll('.timetable-inp').forEach(inp => {
                let day = inp.dataset.day, period = parseInt(inp.dataset.period);
                if(!newTT[day][period]) newTT[day][period] = inp.value;
                else newTT[day].splice(period,1,inp.value);
            });
            db.timetable[currentUser.id] = newTT;
            saveDB();
            notify("برنامه ذخیره شد");
        };

        // Exam & Results generation
        document.getElementById('genResultsBtn').onclick = () => {
            let reportHtml = "<div class='glass-card'><h3>کارنامه</h3><ul>";
            studentList.forEach(s => {
                let studentMarks = db.marks.filter(m => m.studentId === s.id);
                let total = studentMarks.reduce((acc,m)=>acc+m.marks,0);
                reportHtml += `<li>${s.firstName}: مجموع نمرات ${total} | رتبه: ${Math.floor(Math.random()*20)+1}</li>`;
            });
            reportHtml += "</ul><button onclick='window.print()'>چاپ کارنامه</button></div>";
            document.getElementById('examMgmt').innerHTML = reportHtml;
        };

        // AI functions
        document.getElementById('aiChatBtn').onclick = () => alert(aiChatbotSim("سلام معلم، چطور سیستم را بهبود دهم؟"));
        document.getElementById('aiPredictBtn').onclick = () => alert(`پیش‌بینی AI برای کلاس ${classSelect}: ${aiAttendancePrediction(classSelect)}% حضور`);
        document.getElementById('aiScanOCR').onclick = () => {
            let fileInput = document.createElement('input'); fileInput.type='file'; fileInput.accept='image/*';
            fileInput.onchange = async (e) => {
                notify("AI OCR در حال اسکن...");
                let fakeData = await aiOCRSimulate(e.target.files[0]);
                alert(`اطلاعات استخراج شده: ${JSON.stringify(fakeData)}`);
                fakeData.students.forEach((name,idx)=> { if(db.users.find(u=>u.firstName===name)) notify(`نمرات ${name}: ${fakeData.marks[idx]}`); });
            };
            fileInput.click();
        };
        document.getElementById('aiExcelBtn').onclick = () => {
            let excelInput = document.createElement('input'); excelInput.type='file'; excelInput.accept='.xlsx, .csv';
            excelInput.onchange = (ev) => {
                let file = ev.target.files[0];
                let reader = new FileReader();
                reader.onload = function(e) {
                    let data = new Uint8Array(e.target.result);
                    let workbook = XLSX.read(data, {type: 'array'});
                    let sheet = workbook.Sheets[workbook.SheetNames[0]];
                    let rows = XLSX.utils.sheet_to_json(sheet);
                    rows.forEach(row => { if(row.Name) db.users.push({ id:Date.now()+Math.random(), firstName:row.Name, role:'student', email: row.Email || '', password:'pass123', schoolName:currentUser.schoolName }); });
                    saveDB();
                    notify("دانش آموزان از Excel اضافه شدند");
                    renderTeacherDashboard();
                };
                reader.readAsArrayBuffer(file);
            };
            excelInput.click();
        };
    }

    function renderGenericDashboard(title, extraContent) {
        document.getElementById('appRoot').innerHTML = `<div class="dashboard-container"><div class="glass-card"><h2>${title}</h2>${extraContent}<button onclick="logout()" class="btn" style="margin-top:20px;">خروج</button></div></div>`;
    }

    window.logout = () => { currentUser = null; currentRole = null; render(); };

    // PWA Registration & Offline detection
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then(reg => console.log("SW registered", reg)).catch(err=>console.log(err));
    }
    window.addEventListener('load', () => {
        render();
        window.addEventListener('online', () => notify("اتصال به اینترنت برقرار شد!"));
        window.addEventListener('offline', () => notify(" حالت آفلاین - برخی امکانات محدود"));
        // Install popup
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            let installBtn = document.createElement('button');
            installBtn.innerText = "نصب اپلیکیشن 📱";
            installBtn.className = "btn";
            installBtn.style.position="fixed"; installBtn.style.bottom="20px"; installBtn.style.right="20px"; installBtn.style.zIndex="999";
            installBtn.onclick = () => { deferredPrompt.prompt(); deferredPrompt.userChoice.then(()=>installBtn.remove()); };
            document.body.appendChild(installBtn);
        });
    });
</script>
</body>
</html>
