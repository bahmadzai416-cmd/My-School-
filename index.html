    function saveResults(examId, results) {
      let allResults = getResults();
      allResults = allResults.filter(r => r.exam_id !== examId);
      const newResults = Object.entries(results).map(([key, marks]) => {
        const [studentId, subjectId] = key.split('_');
        return { exam_id: examId, student_id: studentId, subject_id: subjectId, marks: Number(marks) || 0 };
      });
      saveData(STORAGE.RESULTS, [...allResults, ...newResults]);
      renderApp();
    }

    // ==================== CALCULATION ENGINE ====================
    function calculateResults(examId) {
      const results = getResults().filter(r => r.exam_id === examId);
      const students = getStudents();
      const subjects = getSubjects();
      const exam = getExams().find(e => e.id === examId);
      
      const classStudents = students.filter(s => s.class_id === exam?.class_id);
      
      return classStudents.map(student => {
        let total = 0;
        let totalFull = 0;
        const subjectResults = {};
        
        subjects.forEach(subject => {
          const result = results.find(r => r.student_id === student.id && r.subject_id === subject.id);
          const marks = result?.marks || 0;
          subjectResults[subject.id] = marks;
          total += marks;
          totalFull += subject.full_marks;
        });
        
        const percentage = totalFull > 0 ? (total / totalFull) * 100 : 0;
        const failedSubjects = subjects.filter(sub => {
          const marks = subjectResults[sub.id] || 0;
          return marks < (sub.pass_marks || 40);
        }).length;
        
        let status = 'pass';
        if (failedSubjects > 2) status = 'fail';
        else if (failedSubjects > 0) status = 'conditional';
        
        return { student, total, percentage, status, subjects: subjectResults };
      }).sort((a, b) => b.total - a.total).map((r, idx) => ({ ...r, rank: idx + 1 }));
    }

    // ==================== EXCEL EXPORT ====================
    function exportToExcel(examId) {
      const exam = getExams().find(e => e.id === examId);
      const subjects = getSubjects();
      const results = calculateResults(examId);
      const XLSX = window.XLSX;
      
      const headers = [t('rollNumber'), t('fullName'), ...subjects.map(s => s.name), t('total'), t('percentage'), t('status'), t('rank')];
      const rows = results.map(r => [
        r.student.roll_number, r.student.full_name,
        ...subjects.map(s => r.subjects[s.id] || ''),
        r.total, r.percentage.toFixed(2) + '%', t(r.status), r.rank
      ]);
      
      const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Results');
      XLSX.writeFile(wb, `${exam?.name}_results.xlsx`);
    }

    // ==================== AI OCR SCANNING ====================
    async function scanMarksheet(imageDataUrl, subjectId, examId) {
      const Tesseract = window.Tesseract;
      const students = getStudents();
      const exam = getExams().find(e => e.id === examId);
      const classStudents = students.filter(s => s.class_id === exam?.class_id);
      
      try {
        const result = await Tesseract.recognize(imageDataUrl, 'fas+eng', {
          logger: m => console.log(m),
          tessedit_pageseg_mode: 6
        });
        
        const text = result.data.text;
        const lines = text.split('\n');
        const extracted = [];
        
        for (const line of lines) {
          const numbers = line.match(/\d+/g);
          if (numbers && numbers.length >= 2) {
            const rollNumber = numbers[0];
            const marks = parseInt(numbers[1]);
            const student = classStudents.find(s => s.roll_number === rollNumber || s.roll_number.toString() === rollNumber);
            if (student && marks <= 100) {
              extracted.push({ student_id: student.id, roll_number: student.roll_number, marks });
            }
          }
        }
        
        return { success: true, extracted, text };
      } catch (error) {
        return { success: false, error: error.message };
      }
    }

    // ==================== PDF EXPORT ====================
    function exportToPDF(examId) {
      const { jsPDF } = window.jspdf;
      const exam = getExams().find(e => e.id === examId);
      const subjects = getSubjects();
      const results = calculateResults(examId);
      
      const doc = new jsPDF({ direction: 'rtl' });
      doc.setFont('Vazirmatn');
      doc.setFontSize(18);
      doc.text(t('results') + ': ' + (currentLang === 'dari' ? exam?.name : exam?.name_pashto), 105, 15, { align: 'center' });
      
      const tableData = results.map(r => [
        r.student.roll_number, r.student.full_name,
        r.total.toString(), r.percentage.toFixed(1) + '%', t(r.status), r.rank.toString()
      ]);
      
      doc.autoTable({
        head: [[t('rollNumber'), t('fullName'), t('total'), t('percentage'), t('status'), t('rank')]],
        body: tableData,
        startY: 25,
        styles: { font: 'Vazirmatn', fontSize: 8 },
        headStyles: { fillColor: [5, 150, 105] }
      });
      
      doc.save(`${exam?.name}_results.pdf`);
    }

    function ScanPage() {
      const [image, setImage] = React.useState(null);
      const [scanning, setScanning] = React.useState(false);
      const [extracted, setExtracted] = React.useState([]);
      const [selectedExam, setSelectedExam] = React.useState('');
      const [selectedSubject, setSelectedSubject] = React.useState('');
      const exams = getExams();
      const subjects = getSubjects();
      
      const handleImage = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (ev) => setImage(ev.target.result);
          reader.readAsDataURL(file);
        }
      };
      
      const runScan = async () => {
        if (!image || !selectedExam || !selectedSubject) { alert('لطفاً امتحان و مضمون را انتخاب کنید'); return; }
        setScanning(true);
        const result = await scanMarksheet(image, selectedSubject, selectedExam);
        if (result.success) {
          setExtracted(result.extracted);
          alert(`${result.extracted.length} ${t('extractedRows')}`);
        } else {
          alert(t('errorOccurred') + ': ' + result.error);
        }
        setScanning(false);
      };
      
      const saveScanned = () => {
        const newMarks = {};
        extracted.forEach(item => {
          newMarks[`${item.student_id}_${selectedSubject}`] = item.marks;
        });
        const existing = getResults().filter(r => r.exam_id === selectedExam);
        const allMarks = {};
        existing.forEach(r => { allMarks[`${r.student_id}_${r.subject_id}`] = r.marks; });
        Object.assign(allMarks, newMarks);
        saveResults(selectedExam, allMarks);
        alert(t('saveSuccess'));
        setExtracted([]);
        setImage(null);
      };
      
      return React.createElement('div', { className: "p-4 space-y-4" },
        React.createElement('h1', { className: "text-2xl font-bold flex items-center gap-2" }, "🤖 ", t('scan')),
        
        React.createElement('div', { className: "bg-white rounded-xl shadow-md p-4 space-y-3" },
          React.createElement('select', { value: selectedExam, onChange: (e) => setSelectedExam(e.target.value), className: "w-full p-2 border rounded-lg" },
            React.createElement('option', { value: "" }, t('selectExam')),
            exams.map(e => React.createElement('option', { key: e.id, value: e.id }, currentLang === 'dari' ? e.name : (e.name_pashto || e.name)))
          ),
          React.createElement('select', { value: selectedSubject, onChange: (e) => setSelectedSubject(e.target.value), className: "w-full p-2 border rounded-lg" },
            React.createElement('option', { value: "" }, t('selectSubject')),
            subjects.map(s => React.createElement('option', { key: s.id, value: s.id }, currentLang === 'dari' ? s.name : (s.name_pashto || s.name)))
          ),
          React.createElement('input', { type: "file", accept: "image/*", capture: "environment", onChange: handleImage, className: "w-full" }),
          image && React.createElement('img', { src: image, className: "rounded-lg max-h-48 mx-auto", alt: "preview" }),
          React.createElement('button', { onClick: runScan, disabled: scanning, className: `w-full py-2 rounded-lg ${scanning ? 'bg-gray-400' : 'bg-indigo-600 text-white'}` }, scanning ? t('processing') : t('scanWithCamera'))
        ),
        
        extracted.length > 0 && React.createElement('div', { className: "bg-white rounded-xl shadow-md p-4 space-y-3" },
          React.createElement('h2', { className: "font-bold" }, t('reviewExtracted')),
          React.createElement('div', { className: "space-y-2" },
            extracted.map((item, i) => React.createElement('div', { key: i, className: "flex justify-between items-center p-2 bg-gray-50 rounded" },
              React.createElement('span', null, `${t('rollNumber')}: ${item.roll_number}`),
              React.createElement('input', { type: "number", value: item.marks, onChange: (e) => { const newExtracted = [...extracted]; newExtracted[i].marks = e.target.value; setExtracted(newExtracted); }, className: "w-20 p-1 border rounded text-center" })
            ))
          ),
          React.createElement('button', { onClick: saveScanned, className: "w-full bg-emerald-600 text-white py-2 rounded-lg" }, t('save'))
        )
      );
    }

    function App() {
      const [currentPage, setCurrentPage] = React.useState('dashboard');
      if (!currentUser) return LoginPage();
      
      const pages = {
        dashboard: React.createElement(DashboardPage, { setPage: setCurrentPage }),
        students: React.createElement(StudentsPage, null),
        classes: React.createElement(ClassesPage, null),
        subjects: React.createElement(SubjectsPage, null),
        exams: React.createElement(ExamsPage, null),
        results: React.createElement(ResultsPage, null),
        scan: React.createElement(ScanPage, null)
      };
      
      const menu = [
        { id: 'dashboard', icon: '📊', label: t('dashboard') },
        { id: 'students', icon: '👨‍🎓', label: t('students') },
        { id: 'classes', icon: '🏫', label: t('classes') },
        { id: 'subjects', icon: '📚', label: t('subjects') },
        { id: 'exams', icon: '📝', label: t('exams') },
        { id: 'results', icon: '📊', label: t('results') },
        { id: 'scan', icon: '🤖', label: t('scan') }
      ];
      
      return React.createElement('div', { className: "min-h-screen bg-gray-50 pb-20" },
        React.createElement('div', { className: "bg-emerald-600 text-white p-4 shadow-lg sticky top-0 z-10" },
          React.createElement('div', { className: "flex justify-between items-center max-w-md mx-auto" },
            React.createElement('div', null,
              React.createElement('h1', { className: "text-lg font-bold" }, t('appName')),
              React.createElement('p', { className: "text-xs opacity-80" }, t('appSubtitle'))
            ),
            React.createElement('div', { className: "flex gap-2" },
              React.createElement('button', { onClick: () => setLanguage('dari'), className: "px-2 py-1 text-xs rounded bg-emerald-700" }, "دری"),
              React.createElement('button', { onClick: () => setLanguage('pashto'), className: "px-2 py-1 text-xs rounded bg-emerald-700 font-pashto" }, "پښتو"),
              React.createElement('button', { onClick: logout, className: "px-3 py-1 text-sm rounded bg-emerald-700" }, t('logout'))
            )
          )
        ),
        React.createElement('div', { className: "max-w-md mx-auto" }, pages[currentPage]),
        React.createElement('div', { className: "fixed bottom-0 left-0 right-0 bg-white border-t shadow-lg flex justify-around p-2 max-w-md mx-auto z-10" },
          menu.map(item => React.createElement('button', { key: item.id, onClick: () => setCurrentPage(item.id), className: `p-2 rounded-lg text-center transition ${currentPage === item.id ? 'text-emerald-600 bg-emerald-50' : 'text-gray-500'}` },
            React.createElement('div', { className: "text-xl" }, item.icon),
            React.createElement('div', { className: "text-xs" }, item.label)
          ))
        )
      );
    }
    
    function renderApp() { const root = ReactDOM.createRoot(document.getElementById('root')); root.render(React.createElement(App)); }
    renderApp();
  </script>
</body>
</html>
