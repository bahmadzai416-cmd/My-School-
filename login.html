<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ننوتل / ورود - School Management Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            direction: rtl;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            max-width: 450px;
            width: 90%;
        }

        .login-box {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .logo h2 {
            color: #1e3c72;
            margin-bottom: 5px;
        }

        .logo p {
            color: #666;
            font-size: 12px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button.secondary {
            background: #6c757d;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
        }

        .register-link a {
            color: #2a5298;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <div class="logo-icon">📚</div>
                <h2>د ښوونځی مدیریت سیسټم</h2>
                <p>د خپل ښوونځي سره ننوځئ</p>
            </div>

            <div class="form-group">
                <label>د ننوتلو ډول / نوع ورود</label>
                <select id="loginType">
                    <option value="school">ښوونځی / مکتب</option>
                    <option value="principal">مدیر / مدیر</option>
                    <option value="teacher">استاد / معلم</option>
                    <option value="accountant">حسابدار / حسابدار</option>
                </select>
            </div>

            <div class="form-group">
                <label>صارف نوم / نام کاربری</label>
                <input type="text" id="username" placeholder="User name">
            </div>

            <div class="form-group">
                <label>پاسورډ / رمز عبور</label>
                <input type="password" id="password" placeholder="Password">
            </div>

            <button onclick="login()">ننوتل / ورود</button>

            <div class="register-link">
                <a href="register_school.html">نوی ښوونځی جوړ کړئ / ثبت مکتب جدید</a>
            </div>
        </div>
    </div>

    <script>
        function login() {
            let loginType = document.getElementById('loginType').value;
            let username = document.getElementById('username').value;
            let password = document.getElementById('password').value;

            // Demo credentials
            if (loginType === 'school' && username === 'school1' && password === '123') {
                window.location.href = 'principal.html?school=1';
            } 
            else if (loginType === 'principal' && username === 'principal1' && password === '123') {
                window.location.href = 'principal.html?school=1&user=principal';
            }
            else if (loginType === 'teacher' && username === 'teacher1' && password === '123') {
                window.location.href = 'teacher.html?school=1&teacher=1';
            }
            else if (loginType === 'accountant' && username === 'accountant1' && password === '123') {
                window.location.href = 'finance.html?school=1';
            }
            else {
                alert('نوم کاربری یا رمز غلط است / Incorrect username or password');
            }
        }
    </script>
</body>
</html>
